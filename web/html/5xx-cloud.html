<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>500 internal server error | Grow Team</title>
        <meta http-equiv="refresh" content="60;URL='/'" />
        <!-- We use `error-styles` webpack assets to styles this page. -->
    </head>
    <body>
        <div class="header">
            <div class="header-main" id="top_navbar">
                <div class="float-left">
                    <a class="brand logo" href="/">
                        <img src="/static/images/logo/zulip-org-logo.svg" alt="Grow Team" height="32"/>
                    </a>
                </div>
            </div>
        </div>
        <div class="error_page">
            <img src="/static/images/errors/500art.svg" alt=""/>
            <div class="errorbox">
                <div class="errorcontent">
                    <!-- Keep in sync with templates/500.html -->
                    <h1 class="lead">Internal server error</h1>
                    <p>
                        Something went wrong. Sorry about that! We're
                        aware of the problem and are working to fix
                        it. Grow Team will load automatically once it is
                        working again.
                    </p>
                    <p>
                        Please check <a href="https://github.com/Growth-Circle/grow-team/issues">Grow Team issue tracker</a> for
                        more information, and <a href="mailto:rama.aditya@growthcircle.id">contact
                        Grow Team support</a> with any questions.
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
