<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>500 internal server error | Grow Team</title>
        <meta http-equiv="refresh" content="60;URL='/'" />
        <!-- We use `error-styles` webpack assets to styles this page. -->
    </head>
    <body>
        <div class="header">
            <div class="header-main" id="top_navbar">
                <div class="float-left">
                    <a class="brand logo" href="/">
                        <img src="/static/images/logo/zulip-org-logo.svg" alt="Grow Team" height="32"/>
                    </a>
                </div>
            </div>
        </div>
        <div class="error_page">
            <img src="/static/images/errors/500art.svg" alt=""/>
            <div class="errorbox">
                <div class="errorcontent">
                    <!-- Keep in sync with templates/500.html -->
                    <h1 class="lead">Internal server error</h1>
                    <p>
                        Something went wrong. Sorry about that!
                        Grow Team will load automatically once it is working again.
                    </p>
                    <p>If you administer this server, you may want to check out the
                        <a href="https://zulip.readthedocs.io/en/stable/production/troubleshooting.html">upstream server troubleshooting guide</a>.
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
