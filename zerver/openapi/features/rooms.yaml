paths:
  /streams/{stream_id}/meta:
    get:
      operationId: get-room-meta
      tags: ["channels"]
      summary: Get a channel's meta
      description: |
        Fetch the type folder, owner, due date, summary opt-in, and member
        counts for the channel with the ID `stream_id`.

        **Changes**: New in Zulip 12.0 (feature level ZF-98ffbd).
      parameters:
        - $ref: "#/components/parameters/ChannelIdInPath"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - $ref: "#/components/schemas/RoomMetaResponse"
              example:
                result: success
                msg: ""
                stream_id: 7
                folder_name: "Proyek"
                owner: {"id": 11, "full_name": "Iago"}
                due_date: "2026-10-30"
                summary_enabled: true
                people_count: 4
                agent_count: 1
                whatsapp: false
                drive_folder_link_id: null
                can_edit_meta: true
                can_toggle_summary: true
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvalidChannelError"
                  - description: |
                      An example JSON response for when the channel ID is not valid:
    patch:
      operationId: update-room-meta
      tags: ["channels"]
      summary: Update a channel's meta
      description: |
        Change the due date and summary opt-in for the channel with the ID
        `stream_id`, and optionally have the channel's built-in assistant
        post its first message.

        Changing `due_date` or asking for `announce` requires being the
        channel's owner or an organization administrator. Changing
        `summary_enabled` requires being the channel's owner and having the
        `room_summary` permission.

        **Changes**: New in Zulip 12.0 (feature level ZF-98ffbd).
      parameters:
        - $ref: "#/components/parameters/ChannelIdInPath"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                due_date:
                  description: |
                    The channel's new due date, as `YYYY-MM-DD`. `null`
                    clears it. Omit this parameter to leave the due date
                    unchanged.
                  type: string
                  nullable: true
                  example: "2026-10-30"
                summary_enabled:
                  description: |
                    Whether the channel opts in to a daily summary.
                  type: boolean
                  example: true
                announce:
                  description: |
                    Whether to have the channel's built-in assistant post
                    its first message in the channel.
                  type: boolean
                  example: true
            encoding:
              due_date:
                contentType: application/json
              summary_enabled:
                contentType: application/json
              announce:
                contentType: application/json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - $ref: "#/components/schemas/RoomMetaResponse"
              example:
                result: success
                msg: ""
                stream_id: 7
                folder_name: "Proyek"
                owner: {"id": 11, "full_name": "Iago"}
                due_date: "2026-10-30"
                summary_enabled: true
                people_count: 4
                agent_count: 1
                whatsapp: false
                drive_folder_link_id: null
                can_edit_meta: true
                can_toggle_summary: true
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidChannelError"
                  - $ref: "#/components/schemas/CodedError"
              examples:
                invalid_channel:
                  summary: The channel ID is not valid.
                  value:
                    result: error
                    msg: Invalid channel ID
                    code: BAD_REQUEST
                no_permission:
                  summary: The requesting user cannot change this channel.
                  value:
                    result: error
                    msg: You do not have permission to change this channel.
                    code: BAD_REQUEST
                bad_due_date:
                  summary: due_date is not a valid YYYY-MM-DD date.
                  value:
                    result: error
                    msg: Enter the date as YYYY-MM-DD.
                    code: BAD_REQUEST

  /streams/{stream_id}/topics:
    get:
      operationId: get-room-topics
      tags: ["channels"]
      summary: Get a channel's topics
      description: |
        Fetch the 50 most recently active topics in the channel with the ID
        `stream_id`, each with its message count.

        In a channel with protected history, only messages the requesting
        user can access count toward `message_count`.

        **Changes**: New in Zulip 12.0 (feature level ZF-98ffbd).
      parameters:
        - $ref: "#/components/parameters/ChannelIdInPath"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      topics:
                        type: array
                        description: |
                          The channel's most recently active topics, newest
                          first.
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - name
                            - max_id
                            - message_count
                          properties:
                            name:
                              type: string
                              description: The topic's name.
                            max_id:
                              type: integer
                              description: The ID of the topic's most recent message.
                            message_count:
                              type: integer
                              description: How many messages the topic has.
              example:
                result: success
                msg: ""
                topics:
                  - name: "rilis"
                    max_id: 812
                    message_count: 34
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvalidChannelError"
                  - description: |
                      An example JSON response for when the channel ID is not valid:

  /streams/{stream_id}/summarize:
    post:
      operationId: summarize-room
      tags: ["channels"]
      summary: Summarize a channel
      description: |
        Ask the channel's built-in assistant for a summary of the last 24
        hours of the channel with the ID `stream_id`, right away instead of
        waiting for the next scheduled one. The summary replaces the
        channel's digest of today.

        The channel must already opt in to a daily summary, and the
        requesting user must be the channel's owner and hold the
        `room_summary` permission.

        When the assistant is already writing today's summary, the request
        starts nothing new and returns the ID of the job that is running.

        **Changes**: New in Zulip 12.0 (feature level ZF-9df9b7).
      parameters:
        - $ref: "#/components/parameters/ChannelIdInPath"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      job_id:
                        type: string
                        description: The ID of the summary job that was started.
              example:
                result: success
                msg: ""
                job_id: "5b1b6f9e-2f2a-4b8a-9c1a-1e2b3c4d5e6f"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidChannelError"
                  - $ref: "#/components/schemas/CodedError"
              examples:
                invalid_channel:
                  summary: The channel ID is not valid.
                  value:
                    result: error
                    msg: Invalid channel ID
                    code: BAD_REQUEST
                summary_disabled:
                  summary: The channel does not opt in to a daily summary.
                  value:
                    result: error
                    msg: Turn on summaries for this channel first.
                    code: BAD_REQUEST
                no_permission:
                  summary: The requesting user is not the channel's owner.
                  value:
                    result: error
                    msg: Only the channel owner can ask for a summary.
                    code: BAD_REQUEST
                budget_used_up:
                  summary: The organization used its model budget for the month.
                  value:
                    result: error
                    msg: The budget for this month is used up. Kaki cannot write a summary now.
                    code: BAD_REQUEST
                not_available:
                  summary: The organization has no built-in assistant to summarize with.
                  value:
                    result: error
                    msg: Kaki is not available in this workspace. Ask an admin to turn it on.
                    code: BAD_REQUEST
                no_new_messages:
                  summary: The channel got no message in the last 24 hours.
                  value:
                    result: error
                    msg: There are no new messages to summarize.
                    code: BAD_REQUEST
                cannot_summarize:
                  summary: The summary job could not start.
                  value:
                    result: error
                    msg: Kaki cannot write a summary for this channel right now.
                    code: BAD_REQUEST

  /streams/{stream_id}/digest:
    get:
      operationId: get-room-digest
      tags: ["channels"]
      summary: Get a channel's digest
      description: |
        Fetch the channel's summary for one day: what was decided, what is
        blocking progress, and what is being waited on.

        Requires being able to see the channel's content.

        **Changes**: New in Zulip 12.0 (feature level ZF-9df9b7).
      parameters:
        - $ref: "#/components/parameters/ChannelIdInPath"
        - name: date
          in: query
          schema:
            type: string
          description: |
            The day to fetch, as `YYYY-MM-DD`. Defaults to today in the
            organization's own time zone.
          example: "2026-09-27"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      digest:
                        type: object
                        nullable: true
                        description: |
                          The channel's digest for the requested day, or
                          `null` when it does not have one.
                        additionalProperties: false
                        required:
                          - date
                          - decided
                          - blocker
                          - waiting
                          - summary
                          - message_count
                        properties:
                          date:
                            type: string
                            description: The digest's day, as `YYYY-MM-DD`.
                          decided:
                            type: array
                            description: What the channel decided.
                            items:
                              type: string
                          blocker:
                            type: array
                            description: What is blocking progress in the channel.
                            items:
                              type: string
                          waiting:
                            type: array
                            description: What the channel is waiting on.
                            items:
                              type: string
                          summary:
                            type: string
                            description: A short prose summary of the day.
                          message_count:
                            type: integer
                            description: How many messages the digest covers.
              example:
                result: success
                msg: ""
                digest:
                  date: "2026-09-27"
                  decided: ["Ship the new pricing page on Friday."]
                  blocker: []
                  waiting: ["Design review of the Room banner."]
                  summary: "Quiet day; mostly review comments."
                  message_count: 12
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvalidChannelError"
                  - description: |
                      An example JSON response for when the channel ID is not valid:

  /channels/quiet:
    get:
      operationId: get-quiet-channels
      tags: ["channels"]
      summary: Get quiet channels
      description: |
        Fetch the channels the requesting user can see that have had no
        message in the last `threshold_days` days.

        A guest always gets an empty list.

        **Changes**: New in Zulip 12.0 (feature level ZF-98ffbd).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      threshold_days:
                        type: integer
                        description: How many days of silence make a channel quiet.
                      quiet_channels:
                        type: array
                        description: The quiet channels, in no particular order.
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - stream_id
                            - last_message_at
                          properties:
                            stream_id:
                              type: integer
                              description: The channel's ID.
                            last_message_at:
                              type: integer
                              description: |
                                When the channel last had a message, as a Unix
                                timestamp. When the channel has never had a
                                message, this is when it was created.
              example:
                result: success
                msg: ""
                threshold_days: 30
                quiet_channels:
                  - stream_id: 7
                    last_message_at: 1727150000

  /channels/archive:
    post:
      operationId: archive-channels
      tags: ["channels"]
      summary: Archive several channels
      description: |
        Archive every channel in `stream_ids` in one request. Each channel
        requires the requesting user to be a channel administrator or hold
        the `room_archive` permission for it.

        **Changes**: New in Zulip 12.0 (feature level ZF-98ffbd).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                stream_ids:
                  description: The IDs of the channels to archive, at most 100.
                  type: array
                  maxItems: 100
                  items:
                    type: integer
                  example: [7, 8]
              required:
                - stream_ids
            encoding:
              stream_ids:
                contentType: application/json
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidChannelError"
                  - $ref: "#/components/schemas/CodedError"
              examples:
                invalid_channel:
                  summary: A channel ID is not valid.
                  value:
                    result: error
                    msg: Invalid channel ID
                    code: BAD_REQUEST
                no_permission:
                  summary: The requesting user cannot archive one of the channels.
                  value:
                    result: error
                    msg: You do not have permission to archive this channel.
                    code: BAD_REQUEST
components:
  schemas:
    RoomMetaResponse:
      additionalProperties: false
      properties:
        result: {}
        msg: {}
        ignored_parameters_unsupported: {}
        stream_id:
          type: integer
          description: The channel's ID.
        folder_name:
          type: string
          nullable: true
          description: The name of the channel's type folder, or `null` when it has none.
        owner:
          type: object
          nullable: true
          description: The channel's owner, or `null` when the realm has nobody to fall back on.
          additionalProperties: false
          required:
            - id
            - full_name
          properties:
            id:
              type: integer
              description: The owner's user ID.
            full_name:
              type: string
              description: The owner's full name.
        due_date:
          type: string
          nullable: true
          description: The channel's due date, as `YYYY-MM-DD`, or `null` when it has none.
        summary_enabled:
          type: boolean
          description: Whether the channel opts in to a daily summary.
        people_count:
          type: integer
          description: How many non-agent subscribers the channel has.
        agent_count:
          type: integer
          description: How many agent subscribers the channel has.
        whatsapp:
          type: boolean
          description: Whether the channel is linked to WhatsApp.
        drive_folder_link_id:
          type: integer
          nullable: true
          description: The ID of the channel's linked Drive folder, or `null` when it has none.
        can_edit_meta:
          type: boolean
          description: Whether the requesting user can change the channel's due date.
        can_toggle_summary:
          type: boolean
          description: Whether the requesting user can change the channel's summary opt-in.
