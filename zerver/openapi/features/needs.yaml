  /needs/resolve:
    post:
      operationId: resolve-needs
      tags:
        - needs
      summary: Mark several items in the Perlu kamu inbox done
      description: |
        Marks each given `mention`, `card_mention` and `card_assigned` item
        done, as `POST /needs/mentions/{message_id}/resolve` and
        `POST /needs/card_notifications/{notification_id}/resolve` do one
        at a time. Each item is handled on its own: one that cannot be
        marked done (it is gone, or not yours) is listed in `failed`, and
        the others stay done. Approvals and decisions are not accepted;
        they are answered one at a time.

        **Changes**: New in Zulip 12.0 (feature level ZF-3491a7).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                need_ids:
                  description: |
                    The `id` of each item, as a JSON list, at most 200. Only
                    mention, `card_mention` and `card_assigned` ids are
                    accepted where the endpoint says so.
                  type: array
                  items:
                    type: string
                  example: ["mention:42", "card_mention:7"]
              required:
                - need_ids
            encoding:
              need_ids:
                contentType: application/json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsBulkResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
                done:
                  - "mention:42"
                failed:
                  - "card_mention:7"
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanFrameworkError"
              example:
                result: error
                msg: "Not logged in: API authentication or user session required"
                code: UNAUTHORIZED
        "405":
          description: REST dispatch returns permitted methods in the body and Allow header.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
  /needs/unresolve:
