paths:
  /needs:
    get:
      operationId: list-needs
      tags:
        - needs
      summary: List approvals, decisions, and mentions waiting for you
      description: |
        Returns the items in the Perlu kamu inbox, with a count per kind:
        agent approvals and agent decisions waiting on you, and personal
        mentions and 1:1 direct messages you have not answered.

        **Changes**: New in Zulip 12.0 (feature level ZF-e3d428).
      parameters:
        - name: kind
          in: query
          description: |
            Narrows the list to one kind of item. Omit it to return all
            three kinds together.
          schema:
            type: string
            enum:
              - approval
              - mention
              - decision
        - name: status
          in: query
          description: |
            `open` lists what still needs you. `resolved` lists what you
            already handled, going back to `since`.
          schema:
            type: string
            enum:
              - open
              - resolved
            default: open
        - name: since
          in: query
          description: |
            With `status=resolved`, how far back to list. The only
            supported value is `today`, resolved in the workspace's own
            timezone.
          schema:
            type: string
            enum:
              - today
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsListResponse"
              example:
                result: success
                msg: ''
                schema_version: 1
                items:
                  - id: "approval:00000000-0000-4000-8000-000000000030"
                    kind: approval
                    actor:
                      type: agent
                      id: 11
                      name: Kaki
                      agent_role: planner
                      shape: circle
                      color: "#FF6A3D"
                      initials: KA
                    stream_id: 3
                    topic: rilis-v2
                    time: '2026-09-25T09:00:00Z'
                    text: Push the release branch
                    attachment:
                      kind: diff
                      id: 00000000-0000-4000-8000-000000000031
                      filename: diff.patch
                    actions:
                      - approve
                    expires_at: '2026-09-25T10:00:00Z'
                    expired: false
                    resolved_at: null
                    resolved_action: null
                    job_id: "00000000-0000-4000-8000-000000000032"
                    approval_version: 1
                    operation_hash: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                    nonce: "00000000-0000-4000-8000-000000000033"
                    job_version: null
                counts:
                  approval: 1
                  mention: 0
                  decision: 0
                  all: 1
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanFrameworkError"
              example:
                result: error
                msg: "Not logged in: API authentication or user session required"
                code: UNAUTHORIZED
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
  /needs/mentions/{message_id}/resolve:
    post:
      operationId: resolve-need-mention
      tags:
        - needs
      summary: Mark a mention in the Perlu kamu inbox done
      description: |
        Marks one personal mention, or one message in a 1:1 direct message,
        done in the Perlu kamu inbox. It then leaves `status=open` and
        lists under `status=resolved` for the rest of the day.

        **Changes**: New in Zulip 12.0 (feature level ZF-e3d428).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsWriteResponse"
              example:
                result: success
                msg: ''
                schema_version: 1
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanFrameworkError"
              example:
                result: error
                msg: "Not logged in: API authentication or user session required"
                code: UNAUTHORIZED
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
      parameters:
        - name: message_id
          in: path
          description: The ID of the message that mentioned you.
          required: true
          schema:
            type: integer
    delete:
      operationId: unresolve-need-mention
      tags:
        - needs
      summary: Undo marking a mention in the Perlu kamu inbox done
      description: |
        Undoes a prior mark-done on one item in the Perlu kamu inbox. It
        lists under `status=open` again if it still qualifies as a need.

        **Changes**: New in Zulip 12.0 (feature level ZF-e3d428).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsWriteResponse"
              example:
                result: success
                msg: ''
                schema_version: 1
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanFrameworkError"
              example:
                result: error
                msg: "Not logged in: API authentication or user session required"
                code: UNAUTHORIZED
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
      parameters:
        - name: message_id
          in: path
          description: The ID of the message that mentioned you.
          required: true
          schema:
            type: integer
components:
  schemas:
    NeedActor:
      type: object
      additionalProperties: false
      description: Who or what this need item is about.
      properties:
        type:
          type: string
          enum:
            - human
            - agent
        id:
          type: integer
          description: A user ID (the actor's own account, bot or human).
        name:
          type: string
        agent_role:
          type: string
          nullable: true
          description: 'null for a human actor; otherwise one of "planner", "builder", "reviewer", "custom".'
        shape:
          type: string
          nullable: true
          description: 'null for a human actor; otherwise one of "circle", "ring", "box".'
        color:
          type: string
          nullable: true
        initials:
          type: string
      required:
        - type
        - id
        - name
        - agent_role
        - shape
        - color
        - initials
    NeedItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'One of "approval:<uuid>", "decision:<job id>", or "mention:<message id>".'
        kind:
          type: string
          enum:
            - approval
            - mention
            - decision
        actor:
          $ref: "#/components/schemas/NeedActor"
        stream_id:
          type: integer
          nullable: true
        topic:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        text:
          type: string
        attachment:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - diff
                - file
            id:
              type: string
            filename:
              type: string
          required:
            - kind
            - id
            - filename
        actions:
          type: array
          items:
            type: string
          description:
            For an approval, one action key (currently always "approve"). For a decision, the
            agent's own option labels. Empty for a mention, whose two actions are fixed
            client-side.
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description:
            When you handled the item. null while it is open, and the
            order of the `status=resolved` list.
        resolved_action:
          type: string
          nullable: true
          description:
            How you handled the item. null while it is open. For an approval,
            "approved" or "rejected". For a decision, your answer. For a
            mention, "done" when you marked it done, or "replied" when you
            replied in its conversation.
        job_id:
          type: string
          nullable: true
          description: 'The job this item is about. null for a mention.'
        approval_version:
          type: integer
          nullable: true
          description:
            'Only on an approval, as `expected_version` for
            `POST /agent/approvals/{approval_id}/decision`. null otherwise.'
        operation_hash:
          type: string
          nullable: true
          description:
            'Only on an approval, as `operation_hash` for
            `POST /agent/approvals/{approval_id}/decision`. null otherwise.'
        nonce:
          type: string
          nullable: true
          description:
            'Only on a pending approval, as `nonce` for
            `POST /agent/approvals/{approval_id}/decision`. null otherwise.'
        job_version:
          type: integer
          nullable: true
          description:
            'Only on a decision, as `expected_version` for
            `POST /agent/jobs/{job_id}/inputs`. null otherwise.'
      required:
        - id
        - kind
        - actor
        - stream_id
        - topic
        - time
        - text
        - attachment
        - actions
        - expires_at
        - expired
        - resolved_at
        - resolved_action
        - job_id
        - approval_version
        - operation_hash
        - nonce
        - job_version
    NeedCounts:
      type: object
      additionalProperties: false
      properties:
        approval:
          type: integer
          minimum: 0
        mention:
          type: integer
          minimum: 0
        decision:
          type: integer
          minimum: 0
        all:
          type: integer
          minimum: 0
      required:
        - approval
        - mention
        - decision
        - all
    NeedsListResponse:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
            - success
        msg:
          type: string
          enum:
            - ""
        schema_version:
          type: integer
          enum:
            - 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/NeedItem"
        counts:
          $ref: "#/components/schemas/NeedCounts"
      required:
        - result
        - msg
        - schema_version
        - items
        - counts
    NeedsWriteResponse:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
            - success
        msg:
          type: string
          enum:
            - ""
        schema_version:
          type: integer
          enum:
            - 1
      required:
        - result
        - msg
        - schema_version
