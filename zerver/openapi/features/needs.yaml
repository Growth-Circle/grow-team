            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
  /needs/unsnooze:
    post:
      operationId: unsnooze-needs
      tags:
        - needs
      summary: Bring snoozed items back to the Perlu kamu inbox
      description: |
        Undoes `POST /needs/snooze` for each given item, so it lists
        again at once.

        **Changes**: New in Zulip 12.0 (feature level ZF-3491a7).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                need_ids:
                  description: |
                    The `id` of each item, as a JSON list, at most 200. Only
                    mention, `card_mention` and `card_assigned` ids are
                    accepted where the endpoint says so.
                  type: array
                  items:
                    type: string
                  example: ["mention:42"]
              required:
                - need_ids
            encoding:
              need_ids:
                contentType: application/json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsWriteResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
