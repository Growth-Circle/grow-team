      tags:
        - needs
      summary: Undo marking several items in the Perlu kamu inbox done
      description: |
        Undoes `POST /needs/resolve`. A mention lists under `status=open`
        again if it still qualifies as a need. A card item is reopened only
        if it was closed in the last 5 minutes, together with every other
        item of yours on the same card that was closed then. Each item is
        handled on its own, and the ones that fail are listed in `failed`.

        **Changes**: New in Zulip 12.0 (feature level ZF-3491a7).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                need_ids:
                  description: |
                    The `id` of each item, as a JSON list, at most 200. Only
                    mention, `card_mention` and `card_assigned` ids are
                    accepted where the endpoint says so.
                  type: array
                  items:
                    type: string
                  example: ["mention:42", "card_mention:7"]
              required:
                - need_ids
            encoding:
              need_ids:
                contentType: application/json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsBulkResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
                done:
                  - "mention:42"
                  - "card_mention:7"
                failed: []
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
