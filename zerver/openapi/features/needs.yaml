components:
  schemas:
    NeedActor:
      type: object
      additionalProperties: false
      description: Who or what this need item is about.
      properties:
        type:
          type: string
          enum:
            - human
            - agent
        id:
          type: integer
          description: A user ID (the actor's own account, bot or human).
        name:
          type: string
        agent_role:
          type: string
          nullable: true
          description: 'null for a human actor; otherwise one of "planner", "builder", "reviewer", "custom".'
        shape:
          type: string
          nullable: true
          description: 'null for a human actor; otherwise one of "circle", "ring", "box".'
        color:
          type: string
          nullable: true
        initials:
          type: string
      required:
        - type
        - id
        - name
        - agent_role
        - shape
        - color
        - initials
    NeedItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description:
            'One of "approval:<uuid>", "mcp_call:<uuid>", "decision:<job id>",
            "mention:<message id>", "card_mention:<notification id>", or
            "card_assigned:<notification id>". An "mcp_call" item is an
            approval (`kind` is `approval`) for a call that an external MCP
            client made to an Ask first tool.'
        kind:
          type: string
          enum:
            - approval
            - mention
            - decision
            - card_mention
            - card_assigned
        actor:
          $ref: "#/components/schemas/NeedActor"
        stream_id:
          type: integer
          nullable: true
        topic:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        text:
          type: string
          description: |
            A plain-text excerpt of what the item is about, at most 400
            characters. For a `mention` or `card_mention` item it is the
            first sentence of the message or note once the @-mentions it
            opens with are removed, so the excerpt shows what is asked;
            a message made only of mentions keeps them. See `raw_text` for
            the text without that trimming.

            **Changes**: In Zulip 12.0 (feature level ZF-413f36), a
            `mention` or `card_mention` item's text is trimmed this way.
            Before, it was the start of the message as it is.
        raw_text:
          type: string
          description: |
            The same excerpt as `text`, without removing leading
            @-mentions or cutting at the first sentence. Equal to `text`
            for the other kinds.

            **Changes**: New in Zulip 12.0 (feature level ZF-413f36).
        attachment:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - diff
                - file
            id:
              type: string
            filename:
              type: string
          required:
            - kind
            - id
            - filename
        actions:
          type: array
          items:
            type: string
          description:
            For an approval, "approve", and also "reject" for an `mcp_call` item. For a decision, the
            agent's own option labels. Empty for a mention, whose two actions are fixed
            client-side.
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When you handled the item. null while it is open, and the
            order of the `status=resolved` list.
        resolved_action:
          type: string
          nullable: true
          description:
            How you handled the item. null while it is open. For an approval,
            "approved" or "rejected". For a decision, your answer. For a
            mention, "done" when you marked it done, or "replied" when you
            replied in its conversation.
        job_id:
          type: string
          nullable: true
          description: "The job this item is about. null for a mention."
        approval_version:
          type: integer
          nullable: true
          description: "Only on an approval, as `expected_version` for
            `POST /agent/approvals/{approval_id}/decision`. null otherwise."
        operation_hash:
          type: string
          nullable: true
          description: "Only on an approval, as `operation_hash` for
            `POST /agent/approvals/{approval_id}/decision`. null otherwise."
        nonce:
          type: string
          nullable: true
          description: "Only on a pending approval, as `nonce` for
            `POST /agent/approvals/{approval_id}/decision`. null otherwise."
        job_version:
          type: integer
          nullable: true
          description: "Only on a decision, as `expected_version` for
            `POST /agent/jobs/{job_id}/inputs`. null otherwise."
        task:
          type: object
          nullable: true
          additionalProperties: false
          description: |
            Only on a `card_mention` or `card_assigned` item: the task card
            it is about. For `card_mention`, `text` is a plain-text excerpt of
            the note; for `card_assigned`, it is the card's title. `actor` is
            who wrote the note or made you responsible. null otherwise.

            Open the card at `#tasks/<id>`.
          properties:
            id:
              type: integer
              description: The task card's ID.
            display_id:
              type: string
              description: The short card ID, such as `GT-37`.
            title:
              type: string
          required:
            - id
            - display_id
            - title
        broadcast:
          type: boolean
          description: |
            Whether a `mention` or `card_mention` item is team-wide: its
            message in a channel, or its note, names 3 or more humans or
            uses a wildcard mention, and does not name you as the only
            human. Bots are not counted; silent mentions are.
            Always `false` for a direct message and for the other kinds.

            **Changes**: In Zulip 12.0 (feature level ZF-48ffae), a team-wide
            item stays open for 48 hours instead of 7 days, and a newer
            team-wide `mention` in the same channel and topic replaces an
            older one, unless you reacted to the older one.

            **Changes**: New in Zulip 12.0 (feature level ZF-988a72).
        mcp_call:
          type: object
          additionalProperties: false
          description: |
            Only on an approval for an external MCP client's call (its `id`
            starts with "mcp_call:"). `text` is the first 600 characters of
            `content`. To decide it, call `POST /mcp/calls/{call_id}/decision`
            with `operation_hash` as `argument_digest`, and `nonce`.

            **Changes**: New in Zulip 12.0 (feature level ZF-49a7c5).
          required:
            [call_id, grant_name, tool, target, content, mentions, digest]
          properties:
            call_id: {type: string}
            grant_name:
              type: string
              description: The name of the connection that made the call.
            tool: {type: string}
            target:
              type: object
              additionalProperties: false
              required: [type, name, topic, message_id]
              properties:
                type:
                  type: string
                  enum: [channel, direct, message, task, column, file]
                name:
                  type: string
                  description: A channel, the people of a direct message, a task, a column or a file, by name.
                topic: {type: string, nullable: true}
                message_id: {type: integer, nullable: true}
            content:
              type: string
              description: The whole content the call would send or change.
            mentions:
              type: array
              items: {type: string}
              description: The full names of the members the message would mention.
            digest:
              type: string
              description: The first 12 characters of the call's argument hash.
      required:
        - id
        - kind
        - actor
        - stream_id
        - topic
        - time
        - text
        - raw_text
        - attachment
        - actions
        - expires_at
        - expired
        - resolved_at
        - resolved_action
        - job_id
        - approval_version
        - operation_hash
        - nonce
        - job_version
        - task
        - broadcast
    NeedCounts:
      type: object
      additionalProperties: false
      properties:
        approval:
          type: integer
          minimum: 0
        mention:
          type: integer
          minimum: 0
        decision:
          type: integer
          minimum: 0
        card_mention:
          type: integer
          minimum: 0
        card_assigned:
          type: integer
          minimum: 0
        all:
          type: integer
          minimum: 0
      required:
        - approval
        - mention
        - decision
        - card_mention
        - card_assigned
        - all
    NeedsListResponse:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
            - success
        msg:
          type: string
          enum:
            - ""
        schema_version:
          type: integer
          enum:
            - 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/NeedItem"
        counts:
          allOf:
            - $ref: "#/components/schemas/NeedCounts"
          description: |
            How many items there are per kind, leaving out team-wide ones
            (`broadcast` is `true`). This is the number a client shows
            by default.

            **Changes**: In Zulip 12.0 (feature level ZF-e9cd61), team-wide
            items are no longer counted here.
        broadcast_counts:
          allOf:
            - $ref: "#/components/schemas/NeedCounts"
          description: |
            The same counts, for team-wide items only.

            **Changes**: New in Zulip 12.0 (feature level ZF-e9cd61).
      required:
        - result
        - msg
        - schema_version
        - items
        - counts
        - broadcast_counts
    NeedsWriteResponse:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
            - success
        msg:
          type: string
          enum:
            - ""
        schema_version:
          type: integer
          enum:
            - 1
      required:
        - result
        - msg
        - schema_version
    NeedsBulkResponse:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
            - success
        msg:
          type: string
          enum:
            - ""
        schema_version:
          type: integer
          enum:
            - 1
        done:
          type: array
          items:
            type: string
          description: The ids that were handled, in the order given.
        failed:
          type: array
          items:
            type: string
          description: |
            The ids that were not handled: the item is gone, is not yours,
            or is of a kind the endpoint does not accept. The items in
            `done` stay handled.
      required:
        - result
        - msg
        - schema_version
        - done
        - failed
    NeedsSnoozeResponse:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
            - success
        msg:
          type: string
          enum:
            - ""
        schema_version:
          type: integer
          enum:
            - 1
        until:
          type: string
          format: date-time
          description: When the snoozed items list again.
      required:
        - result
        - msg
        - schema_version
        - until
