paths:
  /needs:
    get:
      operationId: list-needs
      tags:
        - needs
      summary: List approvals, decisions, and mentions waiting for you
      description: |
        Returns the items in the Perlu kamu inbox, with a count per kind:
        agent approvals and agent decisions waiting on you, personal
        mentions and 1:1 direct messages you have not answered, and task
        cards where a note mentioned you or the card was made your
        responsibility.

        **Changes**: New in Zulip 12.0 (feature level ZF-e3d428).

        In Zulip 12.0 (feature level ZF-d81c47), added the `card_mention`
        and `card_assigned` kinds, the `task` field of an item, and the
        `card_mention` and `card_assigned` counts.

        In Zulip 12.0 (feature level ZF-988a72), added the `broadcast` field
        of an item.

        In Zulip 12.0 (feature level ZF-413f36), added the `raw_text` field
        of an item, and the `text` of a `mention` or `card_mention` item
        is now its first sentence after leading @-mentions.

        In Zulip 12.0 (feature level ZF-48ffae), with `status=open`, a team-wide
        item (`broadcast` is `true`) older than 48 hours is no longer listed,
        and of the team-wide `mention` items in one topic of a channel only
        the newest is listed.

        In Zulip 12.0 (feature level ZF-e9cd61), `counts` no longer counts
        team-wide items, which `broadcast_counts` counts instead.
      parameters:
        - name: kind
          in: query
          description: |
            Narrows the list to one kind of item. Omit it to return all
            kinds together.

            **Changes**: In Zulip 12.0 (feature level ZF-d81c47), added the
            `card_mention` and `card_assigned` kinds.
          schema:
            type: string
            enum:
              - approval
              - mention
              - decision
              - card_mention
              - card_assigned
        - name: status
          in: query
          description: |
            `open` lists what still needs you. `resolved` lists what you
            already handled, going back to `since`.
          schema:
            type: string
            enum:
              - open
              - resolved
            default: open
        - name: since
          in: query
          description: |
            With `status=resolved`, how far back to list. The only
            supported value is `today`, resolved in the workspace's own
            timezone.
          schema:
            type: string
            enum:
              - today
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsListResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
                items:
                  - id: "approval:00000000-0000-4000-8000-000000000030"
                    kind: approval
                    actor:
                      type: agent
                      id: 11
                      name: Kaki
                      agent_role: planner
                      shape: circle
                      color: "#FF6A3D"
                      initials: KA
                    stream_id: 3
                    topic: rilis-v2
                    time: "2026-09-25T09:00:00Z"
                    text: Push the release branch
                    raw_text: Push the release branch
                    attachment:
                      kind: diff
                      id: 00000000-0000-4000-8000-000000000031
                      filename: diff.patch
                    actions:
                      - approve
                    expires_at: "2026-09-25T10:00:00Z"
                    expired: false
                    resolved_at: null
                    resolved_action: null
                    job_id: "00000000-0000-4000-8000-000000000032"
                    approval_version: 1
                    operation_hash: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                    nonce: "00000000-0000-4000-8000-000000000033"
                    job_version: null
                    task: null
                    broadcast: false
                counts:
                  approval: 1
                  mention: 0
                  decision: 0
                  card_mention: 0
                  card_assigned: 0
                  all: 1
                broadcast_counts:
                  approval: 0
                  mention: 0
                  decision: 0
                  card_mention: 0
                  card_assigned: 0
                  all: 0
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanFrameworkError"
              example:
                result: error
                msg: "Not logged in: API authentication or user session required"
                code: UNAUTHORIZED
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
