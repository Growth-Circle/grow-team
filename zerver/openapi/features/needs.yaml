  /needs/snooze:
    post:
      operationId: snooze-needs
      tags:
        - needs
      summary: Put items in the Perlu kamu inbox off until tomorrow morning
      description: |
        Hides each given item, of any kind, from `GET /needs` with
        `status=open` until the next 07:00 on the workspace's clock, the
        hour the morning reminder goes out. Then it lists again without a
        further call. Snoozing an item that no longer exists does nothing.
        An item you mark done while it is snoozed stays done.

        **Changes**: New in Zulip 12.0 (feature level ZF-3491a7).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                need_ids:
                  description: |
                    The `id` of each item, as a JSON list, at most 200. Only
                    mention, `card_mention` and `card_assigned` ids are
                    accepted where the endpoint says so.
                  type: array
                  items:
                    type: string
                  example: ["mention:42", "decision:7"]
              required:
                - need_ids
            encoding:
              need_ids:
                contentType: application/json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsSnoozeResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
                until: "2026-10-18T00:00:00+00:00"
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
