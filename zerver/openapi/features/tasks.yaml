paths:
  /tasks:
    get:
      operationId: get-task-board
      tags: ["task_board"]
      summary: Get the task board
      description: |
        Fetch a task board with its columns and the cards the user may read.

        A card inherits the access of the conversation it came from. A card
        from a channel the user cannot read is never returned.

        **Changes**: New in Zulip 12.0 (feature level ZF-4a7c21).
      parameters:
        - name: board_id
          in: query
          schema:
            type: integer
          description: |
            The ID of the board to fetch. Omit it to fetch the organization's
            default board, which is created on first use.
          example: 1
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      board:
                        $ref: "#/components/schemas/TaskBoard"
                      columns:
                        type: array
                        description: |
                          The board's columns, in display order.
                        items:
                          $ref: "#/components/schemas/TaskBoardColumn"
                      tasks:
                        type: array
                        description: |
                          The cards on the board that this user may read.
                        items:
                          $ref: "#/components/schemas/Task"
                      folded_task_ids:
                        type: array
                        description: |
                          IDs of cards that a column's done window folds away.
                          Clients hide these behind a single row.
                        items:
                          type: integer
              example:
                result: success
                msg: Msg
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Task board does not exist.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when no board exists
                      with the provided ID:
    post:
      operationId: create-task
      tags: ["task_board"]
      summary: Create a task card
      description: |
        Create a card on the organization's task board.

        Creating a card never changes the conversation it came from.

        When the card is created with another human member as its assignee and
        that member can read the card, they are notified the same way as when
        [updating a card](/api/update-task) changes its assignee.

        **Changes**: New in Zulip 12.0 (feature level ZF-4a7c21).

        Before feature level ZF-d81c47, creating a card with an assignee
        notified nobody.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: |
                    The title of the card.
                  example: Lock the October feature list
                body:
                  type: string
                  description: |
                    The card description in [Zulip-flavored Markdown](/help/format-your-message-using-markdown) format.
                  example: Decide the list before the cut-off.
                column_id:
                  type: integer
                  description: |
                    The ID of the column that receives the card.
                  example: 2
                stream_id:
                  type: integer
                  description: |
                    The ID of the channel the card came from. The user must be
                    able to read that channel.
                  example: 5
                topic:
                  type: string
                  description: |
                    The topic the card came from.
                  example: cut-off
                origin_message_id:
                  type: integer
                  description: |
                    The ID of the message the card was created from.
                  example: 43
                assignee_id:
                  type: integer
                  description: |
                    The ID of the user responsible for the card.
                  example: 9
                reviewer_id:
                  type: integer
                  description: |
                    The ID of the user who reviews the card.
                  example: 10
                labels:
                  type: array
                  description: |
                    Short labels shown on the card.
                  items:
                    type: string
                  example: ["ops"]
                checklist:
                  type: array
                  description: |
                    Checklist items, each with a `text` string and a `done` boolean.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      text:
                        type: string
                      done:
                        type: boolean
                  example: [{"text": "Ask product", "done": false}]
                due_at:
                  type: integer
                  description: |
                    UNIX timestamp for the card's deadline.
                  example: 1790000000
                source:
                  type: string
                  enum: ["manual", "brief", "meeting", "whatsapp", "agent"]
                  description: |
                    Where the card came from. Defaults to `manual`.

                    **Changes**: New in Zulip 12.0 (feature level ZF-4f1745).
                  example: brief
              required:
                - title
                - column_id
            encoding:
              labels:
                contentType: application/json
              checklist:
                contentType: application/json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      task_id:
                        type: integer
                        description: |
                          The unique ID of the card created.
                      display_id:
                        type: string
                        description: |
                          The short human-readable ID of the card, such as `GT-214`.
                          The prefix is the organization's task ID prefix, or `GT`
                          when the organization has none.

                          **Changes**: Before Zulip 12.0 (feature level ZF-4f1745),
                          the prefix was always `GT`.
                    example: {"result": "success", "msg": "", "task_id": 1, "display_id": "GT-1"}
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Task board column does not exist.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when the column does not exist:
  /tasks/counts:
    get:
      operationId: get-task-counts
      tags: ["task_board"]
      summary: Get task board counts
      description: |
        Fetch the totals the web app shows in the Work group of the left
        sidebar. Cards from a channel the user cannot read are not counted.

        **Changes**: New in Zulip 12.0 (feature level ZF-4a7c21).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      counts:
                        type: object
                        additionalProperties: false
                        description: |
                          The Work group totals.
                        properties:
                          task_board:
                            type: integer
                            description: |
                              Cards on the board that the user may read.
                          my_tasks:
                            type: integer
                            description: |
                              Unfinished cards assigned to the user.
                          awaiting_my_review:
                            type: integer
                            description: |
                              Cards in a review column that the user reviews.
                          agent_running:
                            type: integer
                            description: |
                              Agent tasks that the user may see and that are running now.
                    example:
                      {
                        "result": "success",
                        "msg": "",
                        "counts":
                          {
                            "task_board": 14,
                            "my_tasks": 5,
                            "awaiting_my_review": 2,
                            "agent_running": 2,
                          },
                      }
  /tasks/{task_id}:
    patch:
      operationId: update-task
      tags: ["task_board"]
      summary: Update a task card
      description: |
        Edit a card, move it to another column, or reorder it inside its column.

        Any user who can read a card, other than a guest, can move it to another
        column or reorder it inside its column. Every other change requires the
        card's assignee (its PIC), its creator, its reviewer, an administrator of
        its channel, or an organization administrator. When a request changes
        anything besides `column_id` and `position`, and the user is not one of
        those people, the whole request fails and nothing changes. A guest can
        move a card only when they are one of those people.

        A move to another column is written to the card history with the user
        who made it. A reorder inside the same column is not.

        Moving a card never changes the conversation it came from. The change is
        written to the card history instead.

        When the organization turns on task status notices, the Notification
        Bot posts a short message to the card's topic when the card moves to
        another column.

        When the card's assignee changes to another human member who can read
        the card, that member gets a `card_assigned` item in their
        [Needs-you list](/api/list-needs) and a direct message from the
        Notification Bot that links to the card as `#tasks/<task id>`. Nobody
        is notified when the user assigns the card to themselves, clears the
        assignee, or assigns a bot.

        **Changes**: New in Zulip 12.0 (feature level ZF-4a7c21).

        Before feature level ZF-63e6db, only the card's assignee, creator,
        reviewer, a channel administrator, or an organization administrator
        could move a card.

        Before feature level ZF-4f1745, any user who could read a card could
        change it.

        Before feature level ZF-4f1745, a card move posted no status notice.

        Before feature level ZF-d81c47, changing the assignee notified nobody.
      parameters:
        - name: task_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the card to update.
          required: true
          example: 3
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: |
                    The new title of the card.
                  example: Reject email without a domain
                body:
                  type: string
                  description: |
                    The new card description in [Zulip-flavored Markdown](/help/format-your-message-using-markdown) format.
                  example: Add a test for the rejected case.
                column_id:
                  type: integer
                  description: |
                    The ID of the column that receives the card.
                  example: 3
                position:
                  type: number
                  description: |
                    The sort key inside the column. A client sends the midpoint
                    between the two cards the moved card lands between.
                  example: 1500
                assignee_id:
                  type: integer
                  description: |
                    The ID of the user responsible for the card.
                  example: 9
                clear_assignee:
                  type: boolean
                  description: |
                    Whether to leave the card unassigned. Overrides `assignee_id`.
                  example: true
                reviewer_id:
                  type: integer
                  description: |
                    The ID of the user who reviews the card.
                  example: 10
                clear_reviewer:
                  type: boolean
                  description: |
                    Whether to remove the reviewer. Overrides `reviewer_id`.
                  example: true
                labels:
                  type: array
                  description: |
                    The new labels shown on the card.
                  items:
                    type: string
                  example: ["ops"]
                checklist:
                  type: array
                  description: |
                    The new checklist, each item with a `text` string and a `done` boolean.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      text:
                        type: string
                      done:
                        type: boolean
                  example: [{"text": "Ask product", "done": true}]
                due_at:
                  type: integer
                  description: |
                    UNIX timestamp for the card's deadline.
                  example: 1790000000
                clear_due_at:
                  type: boolean
                  description: |
                    Whether to remove the deadline. Overrides `due_at`.
                  example: true
                blocked:
                  type: boolean
                  description: |
                    Whether the card is blocked.
                  example: true
            encoding:
              labels:
                contentType: application/json
              checklist:
                contentType: application/json
              position:
                contentType: application/json
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "Task does not exist.",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the card does not
                          exist, or the user cannot read the channel it came from:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "You do not have permission to change this task.",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the user is not
                          allowed to change the card.

                          **Changes**: New in Zulip 12.0 (feature level ZF-4f1745).
    delete:
      operationId: delete-task
      tags: ["task_board"]
      summary: Delete a task card
      description: |
        Delete a card from the board. The conversation it came from is unchanged.

        Only the card's assignee (its PIC), its creator, its reviewer, an
        administrator of its channel, or an organization administrator can
        delete a card.

        **Changes**: New in Zulip 12.0 (feature level ZF-4a7c21).

        Before feature level ZF-4f1745, any user who could read a card could
        delete it.
      parameters:
        - name: task_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the card to delete.
          required: true
          example: 3
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "Task does not exist.",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the card does not exist:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "You do not have permission to change this task.",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the user is not
                          allowed to change the card.

                          **Changes**: New in Zulip 12.0 (feature level ZF-4f1745).
  /tasks/{task_id}/history:
    get:
      operationId: get-task-history
      tags: ["task_board"]
      summary: Get a task card's history
      description: |
        Fetch the recorded changes for one card, newest first.

        **Changes**: New in Zulip 12.0 (feature level ZF-4a7c21).
      parameters:
        - name: task_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the card.
          required: true
          example: 3
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      history:
                        type: array
                        description: |
                          The recorded changes for this card, newest first.
                        items:
                          $ref: "#/components/schemas/TaskHistoryEntry"
              example:
                result: success
                msg: Msg
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Task does not exist.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when the card does not exist:
  /tasks/{task_id}/notes:
    get:
      operationId: get-task-notes
      tags: ["task_board"]
      summary: Get a task card's notes
      description: |
        Fetch the notes written on one card, oldest first.

        **Changes**: New in Zulip 12.0 (feature level ZF-5b2e90).
      parameters:
        - name: task_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the card.
          required: true
          example: 3
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      notes:
                        type: array
                        description: |
                          The notes on this card, oldest first.
                        items:
                          $ref: "#/components/schemas/TaskNote"
                    example:
                      {
                        "result": "success",
                        "msg": "",
                        "notes":
                          [
                            {
                              "id": 1,
                              "task_id": 3,
                              "author_id": 10,
                              "content": "Waiting on the design review.",
                              "rendered_content": "<p>Waiting on the design review.</p>",
                              "date_created": 1760000000,
                            },
                          ],
                      }
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Task does not exist.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when the card does not
                      exist, or the user cannot read the channel it came from:
    post:
      operationId: add-task-note
      tags: ["task_board"]
      summary: Add a note to a task card
      description: |
        Write a note on a card. Any user who can read the card can add a
        note, whether or not they can change the card.

        The note is rendered with [Zulip-flavored
        Markdown](/help/format-your-message-using-markdown). Adding a note
        records a `note_added` entry in the card's history and sends the
        card's audience a `task_note` event and a `task` event with the new
        `note_count`.

        A note can mention a member with the usual `@**Full Name|id**`
        syntax. Each mentioned member who can read the card gets a
        `card_mention` item in their [Needs-you list](/api/list-needs) and
        a direct message from the Notification Bot that links to the card
        as `#tasks/<task id>`.

        **Changes**: New in Zulip 12.0 (feature level ZF-5b2e90). In
        feature level ZF-d81c47, mentions started to notify, and the
        response gained `ignored_mentions`.
      parameters:
        - name: task_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the card.
          required: true
          example: 3
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: |
                    The note, in Zulip-flavored Markdown. Surrounding
                    whitespace is removed, and the result must be between 1
                    and 10,000 characters long.
                  example: Waiting on the design review.
              required:
                - content
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      note:
                        $ref: "#/components/schemas/TaskNote"
                      ignored_mentions:
                        type: array
                        description: |
                          The IDs of users the note mentions but who were not
                          notified because they cannot read the card. A client
                          can warn the author that these people will not see
                          the note. Mentions of bots, of the author, and of
                          `@all`-style wildcards never notify and are not
                          listed.

                          **Changes**: New in Zulip 12.0 (feature level ZF-d81c47).
                        items:
                          type: integer
                    example:
                      {
                        "result": "success",
                        "msg": "",
                        "note":
                          {
                            "id": 1,
                            "task_id": 3,
                            "author_id": 10,
                            "content": "Waiting on the design review.",
                            "rendered_content": "<p>Waiting on the design review.</p>",
                            "date_created": 1760000000,
                          },
                        "ignored_mentions": [],
                      }
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "Task does not exist.",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the card does not
                          exist, or the user cannot read the channel it came from:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "content cannot be blank",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the note is empty
                          or longer than 10,000 characters:
  /tasks/{task_id}/notes/{note_id}:
    delete:
      operationId: delete-task-note
      tags: ["task_board"]
      summary: Delete a note from a task card
      description: |
        Delete a note. Only the note's author or an organization
        administrator can delete it. The card's audience receives a
        `task_note` event with `op` set to `remove`, and a `task` event with
        the new `note_count`.

        **Changes**: New in Zulip 12.0 (feature level ZF-5b2e90).
      parameters:
        - name: task_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the card.
          required: true
          example: 3
        - name: note_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the note to delete.
          required: true
          example: 1
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "Note does not exist.",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the note does not
                          exist on this card:
                  - allOf:
                      - $ref: "#/components/schemas/CodedError"
                      - example:
                          {
                            "code": "BAD_REQUEST",
                            "msg": "Only the author or an administrator can delete a note.",
                            "result": "error",
                          }
                        description: |
                          A typical failed JSON response for when the user did not
                          write the note and is not an organization administrator:
  /tasks/{task_id}/notifications/resolve:
    post:
      operationId: resolve-task-notifications
      tags: ["task_board"]
      summary: Mark a task card's notifications for you as handled
      description: |
        Close every open notification the card holds for the current user
        (a note that mentioned them, or the card being made theirs). A client
        calls this when the user opens the card. The items leave the
        user's [Needs-you list](/api/list-needs). The call succeeds, and does
        nothing, when there is nothing open.

        **Changes**: New in Zulip 12.0 (feature level ZF-d81c47).
      parameters:
        - name: task_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the card.
          required: true
          example: 3
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Task does not exist.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when the card does not
                      exist, or the user cannot read the channel it came from:
  /task_boards/{board_id}:
    patch:
      operationId: update-task-board
      tags: ["task_board"]
      summary: Rename a task board
      description: |
        Change the name of a task board.

        **Changes**: New in Zulip 12.0 (feature level ZF-4a7c21).
      parameters:
        - name: board_id
          in: path
          schema:
            type: integer
          description: |
            The ID of the board to rename.
          required: true
          example: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: |
                    The new name of the board.
                  example: October release
              required:
                - name
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Task board does not exist.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when no board exists
                      with the provided ID:

components:
  schemas:
    TaskBoard:
      type: object
      description: |
        Object containing the details of a task board.
      additionalProperties: false
      properties:
        id:
          type: integer
          description: |
            The unique ID of the board.
        name:
          type: string
          description: |
            The name of the board.
        date_created:
          type: integer
          description: |
            The UNIX timestamp for when the board was created, in UTC seconds.
    TaskBoardColumn:
      type: object
      description: |
        Object containing the details of one column on a task board.
      additionalProperties: false
      properties:
        id:
          type: integer
          description: |
            The unique ID of the column.
        board_id:
          type: integer
          description: |
            The ID of the board this column belongs to.
        name:
          type: string
          description: |
            The name of the column.
        order:
          type: integer
          description: |
            The position of the column on the board, counting from zero.
        work_limit:
          type: integer
          nullable: true
          description: |
            How many cards the column holds before it warns. The limit never
            blocks a move; it only asks the mover to confirm.
        done_window_days:
          type: integer
          nullable: true
          description: |
            How many days a finished card stays visible in this column. Older
            cards are reported in `folded_task_ids`.
        is_review:
          type: boolean
          description: |
            Whether cards in this column wait on their reviewer.
    Task:
      type: object
      description: |
        Object containing the details of one card on a task board.
      additionalProperties: false
      properties:
        id:
          type: integer
          description: |
            The unique ID of the card.
        display_id:
          type: string
          description: |
            The short human-readable ID of the card, such as `GT-214`. The
            prefix is the organization's task ID prefix, or `GT` when the
            organization has none.

            **Changes**: Before Zulip 12.0 (feature level ZF-4f1745), the
            prefix was always `GT`.
        board_id:
          type: integer
          description: |
            The ID of the board the card is on.
        column_id:
          type: integer
          description: |
            The ID of the column the card is in.
        title:
          type: string
          description: |
            The title of the card.
        body:
          type: string
          description: |
            The card description in [Zulip-flavored Markdown](/help/format-your-message-using-markdown) format.
        position:
          type: number
          description: |
            The sort key of the card inside its column.
        stream_id:
          type: integer
          nullable: true
          description: |
            The ID of the channel the card came from, or `null` for a card
            created directly on the board.
        topic:
          type: string
          description: |
            The topic the card came from.
        origin_message_id:
          type: integer
          nullable: true
          description: |
            The ID of the message the card was created from.
        creator_id:
          type: integer
          description: |
            The ID of the user who created the card.
        assignee_id:
          type: integer
          nullable: true
          description: |
            The ID of the user responsible for the card.
        reviewer_id:
          type: integer
          nullable: true
          description: |
            The ID of the user who reviews the card.
        agent_profile_id:
          type: string
          nullable: true
          description: |
            The ID of the agent profile that runs this card, if any.
        agent_job_id:
          type: string
          nullable: true
          description: |
            The ID of the agent task that this card follows, if any.
        labels:
          type: array
          description: |
            Short labels shown on the card.
          items:
            type: string
        checklist:
          type: array
          description: |
            Checklist items, each with a `text` string and a `done` boolean.
          items:
            type: object
            additionalProperties: false
            properties:
              text:
                type: string
              done:
                type: boolean
        due_at:
          type: integer
          nullable: true
          description: |
            The UNIX timestamp for the card's deadline, in UTC seconds.
        blocked:
          type: boolean
          description: |
            Whether the card is blocked.
        completed_at:
          type: integer
          nullable: true
          description: |
            The UNIX timestamp for when the card entered a column with a done
            window, in UTC seconds.
        date_created:
          type: integer
          description: |
            The UNIX timestamp for when the card was created, in UTC seconds.
        last_updated:
          type: integer
          description: |
            The UNIX timestamp for the card's last change, in UTC seconds.
        source:
          type: string
          enum: ["manual", "brief", "meeting", "whatsapp", "agent"]
          description: |
            Where the card came from.

            **Changes**: New in Zulip 12.0 (feature level ZF-4f1745).
        note_count:
          type: integer
          description: |
            The number of notes on the card.

            **Changes**: New in Zulip 12.0 (feature level ZF-5b2e90).
    TaskNote:
      type: object
      description: |
        Object containing one note on a card.

        **Changes**: New in Zulip 12.0 (feature level ZF-5b2e90).
      additionalProperties: false
      properties:
        id:
          type: integer
          description: |
            The unique ID of the note.
        task_id:
          type: integer
          description: |
            The ID of the card the note is on.
        author_id:
          type: integer
          description: |
            The ID of the user who wrote the note.
        content:
          type: string
          description: |
            The note in [Zulip-flavored Markdown](/help/format-your-message-using-markdown) format.
        rendered_content:
          type: string
          description: |
            The note rendered as HTML, the same way as a message.
        date_created:
          type: integer
          description: |
            The UNIX timestamp for when the note was written, in UTC seconds.
    TaskHistoryEntry:
      type: object
      description: |
        Object containing one recorded change to a card.
      additionalProperties: false
      properties:
        id:
          type: integer
          description: |
            The unique ID of the history entry.
        task_id:
          type: integer
          description: |
            The ID of the card this entry belongs to.
        acting_user_id:
          type: integer
          nullable: true
          description: |
            The ID of the user who made the change.
        kind:
          type: string
          description: |
            What changed. One of `created`, `moved`, `edited`, `assigned`, or
            `note_added`.

            **Changes**: In Zulip 12.0 (feature level ZF-5b2e90), added the
            `note_added` kind, whose `extra_data` holds the `note_id`.
        event_time:
          type: integer
          description: |
            The UNIX timestamp for the change, in UTC seconds.
        extra_data:
          type: object
          additionalProperties: true
          description: |
            Details of the change, which depend on `kind`.
