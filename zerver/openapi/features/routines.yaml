        can_edit:
          type: boolean
          description: |
            Whether the user can change, pause, delete and run the routine.
        last_run:
          anyOf:
            - $ref: "#/components/schemas/RoutineRun"
            - type: object
              nullable: true
              additionalProperties: false
              enum:
                - null
          description: |
            The newest run, or `null` when the routine never ran.
      required:
        - id
        - title
        - instructions
        - agent_profile_id
        - agent_name
        - owner_id
        - stream_id
        - topic
        - pattern_kind
        - interval
        - time_of_day
        - weekdays
        - month_day
        - timezone
        - model_preset
        - enabled
        - paused_reason
        - next_run_at
        - last_run_at
        - last_status
        - executor
        - can_edit
        - last_run
    RoutineRun:
      type: object
      description: |
        One run of a routine.

        **Changes**: New in Zulip 12.0 (feature level ZF-3ee9ff).
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: |
            The ID of the run.
        routine_id:
          type: string
          format: uuid
          description: |
            The ID of the routine.
        trigger:
          type: string
          enum:
            - schedule
            - manual
          description: |
            `schedule` for a run that its schedule started, `manual` for one that a user
            started with Run now.
        scheduled_for:
          type: integer
          description: |
            The UNIX timestamp of the occurrence this run is for. For a manual run, the
            moment it was asked for.
        started_at:
          type: integer
          nullable: true
          description: |
            The UNIX timestamp for when the run started.
        finished_at:
          type: integer
          nullable: true
          description: |
            The UNIX timestamp for when the run ended, or `null` while it runs.
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - skipped_budget
            - skipped_unavailable
            - skipped_missed
          description: |
            The state of the run. `skipped_missed` is an occurrence that the host was down
            for. The other `skipped` states did not start a job.
        error_code:
          type: string
          description: |
            Why a run failed or was skipped, such as `job_failed`, `agent_unavailable`,
            `agent_access`, `channel_unavailable`, `budget_exceeded` or `job_not_created`.
            Empty otherwise.
        result_message_id:
          type: integer
          nullable: true
          description: |
            The ID of the message that holds the result, when there is one.
        cost_microunits:
          type: integer
          nullable: true
          description: |
            The cost of the run in millionths of the billing unit, or `null` when nobody
            measured it. It is never zero for a run that was not measured.
      required:
        - id
        - routine_id
        - trigger
        - scheduled_for
        - started_at
        - finished_at
        - status
        - error_code
        - result_message_id
        - cost_microunits
