  /routines/agents:
    get:
      operationId: list-routine-agents
      tags: ["routines"]
      summary: List agents for a routine
      description: |
        List the agents that the user can give a routine to, the built-in agent that is used
            when none is chosen, and the timezone that a new routine gets.

        **Changes**: New in Zulip 12.0 (feature level ZF-3ee9ff).
