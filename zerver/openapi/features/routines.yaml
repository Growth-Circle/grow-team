paths:
  /routines:
    get:
      operationId: list-routines
      tags: ["routines"]
      summary: List routines
      description: |
        List the routines that the user can read: every routine of a channel the user can read,
            and every routine that runs outside Sanji. A routine that runs outside Sanji is shown but
            never run by Sanji, and cannot be changed through this API. Each item has the newest run,
            or `null` when it never ran.

            A guest cannot use routines, and gets an error.

        **Changes**: New in Zulip 12.0 (feature level ZF-3ee9ff).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      routines:
                        type: array
                        description: |
                          The routines, ordered by title.
                        items:
                          $ref: "#/components/schemas/RoutineDetail"
                    example:
                      {
                        "result": "success",
                        "msg": "",
                        "routines":
                          [
                            {
                              "id": "6f1c8a52-3a52-4d56-9f0a-0d7a8c1d2e34",
                              "title": "Brief pagi",
                              "instructions": "Rangkum yang perlu diperhatikan hari ini.",
                              "agent_profile_id": "0b7f8a9e-8c53-4d63-a5c9-2f1a1c5e9a10",
                              "agent_name": "Sanji Agent",
                              "owner_id": 10,
                              "stream_id": 12,
                              "topic": "Brief",
                              "pattern_kind": "daily",
                              "interval": null,
                              "time_of_day": "08:00",
                              "weekdays": [],
                              "month_day": null,
                              "timezone": "Asia/Jakarta",
                              "model_preset": "",
                              "enabled": true,
                              "paused_reason": "",
                              "next_run_at": 1760577600,
                              "last_run_at": 1760491200,
                              "last_status": "succeeded",
                              "executor": "agent",
                              "can_edit": true,
                              "last_run":
                                {
                                  "id": "a9d1e6c7-4b3c-4c07-8c7a-5b0d2f4a7e11",
                                  "routine_id": "6f1c8a52-3a52-4d56-9f0a-0d7a8c1d2e34",
                                  "trigger": "schedule",
                                  "scheduled_for": 1760491200,
                                  "started_at": 1760491201,
                                  "finished_at": 1760491260,
                                  "status": "succeeded",
                                  "error_code": "",
                                  "result_message_id": 4521,
                                  "cost_microunits": null,
                                },
                            },
                          ],
                      }
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Scheduled routines are for members, not guests.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when the user is a guest:
    post:
      operationId: create-routine
      tags: ["routines"]
      summary: Create a routine
      description: |
        Create a routine. Its next run is worked out at once, on the clock of its timezone. The
            owner is the user who creates it.

            A guest, a user who cannot read the channel, and a user who cannot use the agent get an
            error, and nothing is saved.

        **Changes**: New in Zulip 12.0 (feature level ZF-3ee9ff).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: |
                    The title, 1 to 100 characters once surrounding whitespace is removed. It is also
                    the title of the agent's job card.
                  example: Brief pagi
                instructions:
                  type: string
                  description: |
                    What the agent shall do, 1 to 4000 characters.
                  example: Rangkum yang perlu diperhatikan hari ini.
                agent_profile_id:
                  type: string
                  format: uuid
                  description: |
                    The agent that does the work and posts under its own name. Omit it to use the built-in
                    Sanji Agent. The user must be able to use the agent.
                  example: 0b7f8a9e-8c53-4d63-a5c9-2f1a1c5e9a10
                stream_id:
                  type: integer
                  description: |
                    The channel the routine posts in. The user must be able to read it.
                  example: 12
                topic:
                  type: string
                  description: |
                    The topic the routine posts in, 1 to 60 characters.
                  example: Brief
                pattern_kind:
                  type: string
                  description: |
                    How often the routine runs. `every_minutes` and `every_hours` use `interval`.
                    `daily`, `weekdays` (Monday to Friday), `weekly` and `monthly` use `time_of_day`.
                    `weekly` also uses `weekdays`, and `monthly` also uses `month_day`.
                  enum:
                    - every_minutes
                    - every_hours
                    - daily
                    - weekdays
                    - weekly
                    - monthly
                  example: daily
                interval:
                  type: integer
                  description: |
                    For `every_minutes`, the minutes between runs, from 15 to 59. For `every_hours`,
                    the hours between runs, from 1 to 23. Runs count from midnight in the routine's
                    timezone.
                  example: 15
                time_of_day:
                  type: string
                  description: |
                    The time of day as 24-hour `HH:MM` in the routine's timezone.
                  example: "08:00"
                weekdays:
                  type: array
                  items:
                    type: integer
                  description: |
                    For `weekly`, the days of the week, with Monday as 0 and Sunday as 6. Send it as a
                    JSON-encoded list.
                  example: [4]
                month_day:
                  type: integer
                  description: |
                    For `monthly`, the day of the month, from 1 to 31. A month without that day runs
                    on its last day.
                  example: 1
                timezone:
                  type: string
                  description: |
                    The IANA timezone of the schedule. Omit it to use the timezone of the organization's
                    agent settings.
                  example: Asia/Jakarta
                model_preset:
                  type: string
                  description: |
                    The model preset to show for the routine. Jobs use the model of the agent's
                    profile.
                  enum:
                    - ""
                    - fast
                    - balanced
                    - best
                  default: ""
                  example: balanced
              required:
                - title
                - instructions
                - stream_id
                - topic
                - pattern_kind
            encoding:
              weekdays:
                contentType: application/json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - additionalProperties: false
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      routine:
                        $ref: "#/components/schemas/RoutineDetail"
                    example:
                      {
                        "result": "success",
                        "msg": "",
                        "routine":
                          {
                            "id": "6f1c8a52-3a52-4d56-9f0a-0d7a8c1d2e34",
                            "title": "Brief pagi",
                            "instructions": "Rangkum yang perlu diperhatikan hari ini.",
                            "agent_profile_id": "0b7f8a9e-8c53-4d63-a5c9-2f1a1c5e9a10",
                            "agent_name": "Sanji Agent",
                            "owner_id": 10,
                            "stream_id": 12,
                            "topic": "Brief",
                            "pattern_kind": "daily",
                            "interval": null,
                            "time_of_day": "08:00",
                            "weekdays": [],
                            "month_day": null,
                            "timezone": "Asia/Jakarta",
                            "model_preset": "",
                            "enabled": true,
                            "paused_reason": "",
                            "next_run_at": 1760577600,
                            "last_run_at": 1760491200,
                            "last_status": "succeeded",
                            "executor": "agent",
                            "can_edit": true,
                            "last_run": null,
                          },
                      }
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CodedError"
                  - example:
                      {
                        "code": "BAD_REQUEST",
                        "msg": "Minutes between runs must be from 15 to 59.",
                        "result": "error",
                      }
                    description: |
                      A typical failed JSON response for when the schedule cannot run:
