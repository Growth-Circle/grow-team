                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      agents:
                        type: array
                        description: |
                          The agents the user can use.
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: |
                                The ID of the agent profile.
                            name:
                              type: string
                              description: |
                                The name of the agent.
                      default_agent_id:
                        type: string
                        format: uuid
                        nullable: true
                        description: |
                          The ID of the built-in agent that posts a routine when none is chosen, or `null` when the
                          organization has none.
                      default_timezone:
                        type: string
                        description: |
                          The IANA timezone that a new routine gets when none is chosen: the timezone of the
                          organization's agent settings.
                    example:
                      {
                        "result": "success",
                        "msg": "",
                        "agents":
                          [
                            {
                              "id": "0b7f8a9e-8c53-4d63-a5c9-2f1a1c5e9a10",
                              "name": "Sanji Agent",
                            },
                          ],
                        "default_agent_id": "0b7f8a9e-8c53-4d63-a5c9-2f1a1c5e9a10",
