components:
  schemas:
    Routine:
      type: object
      description: |
        A routine as the `routine` events carry it.

        **Changes**: New in Zulip 12.0 (feature level ZF-3ee9ff).
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: |
            The ID of the routine.
        title:
          type: string
          description: |
            The title.
        instructions:
          type: string
          description: |
            What the agent shall do. Empty for a routine that runs
            outside Sanji and has none.
        agent_profile_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The ID of the agent profile, or `null` for a routine that runs outside Sanji.
        agent_name:
          type: string
          description: |
            The name of the agent. For a routine that runs outside Sanji, the name it
            was registered with.
        owner_id:
          type: integer
          description: |
            The ID of the user whose access the routine uses.
        stream_id:
          type: integer
          nullable: true
          description: |
            The ID of the channel it posts in, or `null` for a routine that runs outside
            Sanji and has none.
        topic:
          type: string
          description: |
            The topic it posts in.
        pattern_kind:
          type: string
          enum:
            - every_minutes
            - every_hours
            - daily
            - weekdays
            - weekly
            - monthly
          description: |
            How often it runs.
        interval:
          type: integer
          nullable: true
          description: |
            Minutes or hours between runs, for `every_minutes` and `every_hours`.
        time_of_day:
          type: string
          nullable: true
          description: |
            The time of day as 24-hour `HH:MM` in `timezone`, for the patterns that use it.
        weekdays:
          type: array
          items:
            type: integer
          description: |
            For `weekly`, the days of the week, with Monday as 0.
        month_day:
          type: integer
          nullable: true
          description: |
            For `monthly`, the day of the month.
        timezone:
          type: string
          description: |
            The IANA timezone of the schedule.
        model_preset:
          type: string
          enum:
            - ""
            - fast
            - balanced
            - best
          description: |
            The model preset shown for the routine. An empty string means none.
        enabled:
          type: boolean
          description: |
            Whether the routine runs. A paused routine is `false`.
        paused_reason:
          type: string
          enum:
            - ""
            - user
            - failures
            - budget
            - unavailable
          description: |
            Why a routine that is not enabled stopped: a person paused it (`user`), three
            runs in a row failed (`failures`), the budget ran out (`budget`), or the agent or
            channel was no longer available (`unavailable`). Empty while it runs.
        next_run_at:
          type: integer
          nullable: true
          description: |
            The UNIX timestamp of the next run, in UTC seconds.
        last_run_at:
          type: integer
          nullable: true
          description: |
            The UNIX timestamp of the last time a run started.
        last_status:
          type: string
          description: |
            The status of the last run, or an empty string when it never ran.
        executor:
          type: string
          enum:
            - agent
            - external
          description: |
            `agent` when Sanji runs it. `external` when something outside Sanji runs it, and
            Sanji only shows it.
      required:
        - id
        - title
        - instructions
        - agent_profile_id
        - agent_name
        - owner_id
        - stream_id
        - topic
        - pattern_kind
        - interval
        - time_of_day
        - weekdays
        - month_day
        - timezone
        - model_preset
        - enabled
        - paused_reason
        - next_run_at
        - last_run_at
        - last_status
        - executor
    RoutineDetail:
