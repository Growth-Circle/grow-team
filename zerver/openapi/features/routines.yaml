    patch:
      operationId: update-routine
      tags: ["routines"]
      summary: Change a routine
      description: |
        Change the fields that are sent, and keep the others. A change of pattern clears the
            fields that the new pattern does not use. A change to the schedule works out the next run
            again; a change of title or instructions does not move it.

            The owner of the routine, or an administrator, can change it. A routine that runs outside
            Sanji cannot be changed. The routine runs for its owner, so the owner must be able to read
            a new channel and use a new agent.

        **Changes**: New in Zulip 12.0 (feature level ZF-3ee9ff).
      parameters:
        - name: routine_id
          in: path
          schema:
            type: string
            format: uuid
          description: |
            The ID of the routine.
          required: true
          example: 6f1c8a52-3a52-4d56-9f0a-0d7a8c1d2e34
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: |
                    The title, 1 to 100 characters once surrounding whitespace is removed. It is also
                    the title of the agent's job card.
                  example: Brief pagi
                instructions:
                  type: string
                  description: |
                    What the agent shall do, 1 to 4000 characters.
                  example: Rangkum yang perlu diperhatikan hari ini.
                agent_profile_id:
                  type: string
                  format: uuid
                  description: |
                    The agent that does the work. The owner of the routine must be able to use it.
                  example: 0b7f8a9e-8c53-4d63-a5c9-2f1a1c5e9a10
                stream_id:
                  type: integer
                  description: |
                    The channel the routine posts in. The owner of the routine and the user must be able to
                    read it.
                  example: 12
                topic:
                  type: string
                  description: |
                    The topic the routine posts in, 1 to 60 characters.
                  example: Brief
                pattern_kind:
                  type: string
                  description: |
                    How often the routine runs. `every_minutes` and `every_hours` use `interval`.
                    `daily`, `weekdays` (Monday to Friday), `weekly` and `monthly` use `time_of_day`.
                    `weekly` also uses `weekdays`, and `monthly` also uses `month_day`.
                  enum:
                    - every_minutes
                    - every_hours
                    - daily
                    - weekdays
                    - weekly
                    - monthly
                  example: daily
                interval:
                  type: integer
                  description: |
                    For `every_minutes`, the minutes between runs, from 15 to 59. For `every_hours`,
                    the hours between runs, from 1 to 23. Runs count from midnight in the routine's
                    timezone.
                  example: 15
                time_of_day:
                  type: string
                  description: |
                    The time of day as 24-hour `HH:MM` in the routine's timezone.
                  example: "08:00"
                weekdays:
                  type: array
                  items:
                    type: integer
                  description: |
                    For `weekly`, the days of the week, with Monday as 0 and Sunday as 6. Send it as a
                    JSON-encoded list.
                  example: [4]
                month_day:
                  type: integer
                  description: |
                    For `monthly`, the day of the month, from 1 to 31. A month without that day runs
                    on its last day.
                  example: 1
                timezone:
                  type: string
                  description: |
                    The IANA timezone of the schedule.
                  example: Asia/Jakarta
                model_preset:
                  type: string
                  description: |
                    The model preset to show for the routine. Jobs use the model of the agent's
                    profile.
                  enum:
                    - ""
                    - fast
                    - balanced
                    - best
                  example: balanced
            encoding:
