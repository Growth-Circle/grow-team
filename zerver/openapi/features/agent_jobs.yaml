paths:
  /agent/jobs:
    get:
      operationId: list-agent-jobs
      tags:
        - agents
      summary: List agent jobs
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanJobsResponse"
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version. Runner credential rejection includes it.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AgentHumanFrameworkError"
                  - $ref: "#/components/schemas/AgentHumanSafeError"
              examples:
                missing_authentication:
                  value:
                    result: error
                    msg: "Not logged in: API authentication or user session required"
                    code: UNAUTHORIZED
                runner_credential:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: INVALID_API_KEY
        "403":
          description:
            This REST route is CSRF exempt. The server defines no endpoint-specific 403 response
            envelope.
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
      parameters:
        - name: offset
          in: query
          description: Number of results to skip.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: view
          in: query
          description:
            Which tasks to return. "waiting" is those that wait for an approval or
            input the reader can give. Defaults to "all".
          schema:
            type: string
            enum:
              - mine
              - waiting
              - running
              - all
    post:
      operationId: create-agent-job
      tags:
        - agents
      summary: Create an agent job
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanJobResponse"
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version. Runner credential rejection includes it.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AgentHumanFrameworkError"
                  - $ref: "#/components/schemas/AgentHumanSafeError"
              examples:
                missing_authentication:
                  value:
                    result: error
                    msg: "Not logged in: API authentication or user session required"
                    code: UNAUTHORIZED
                runner_credential:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: INVALID_API_KEY
        "403":
          description:
            This REST route is CSRF exempt. The server defines no endpoint-specific 403 response
            envelope.
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                payload:
                  allOf:
                    - $ref: "#/components/schemas/AgentHumanCreateJobRequest"
                  description:
                    Send exactly one form field named payload. Its value is the serialized JSON
                    request object.
                  example:
                    {
                      "schema_version": 1,
                      "profile_id": "00000000-0000-4000-8000-000000000001",
                      "source_message_id": 9,
                      "repository_id": null,
                      "request": "Summarize this thread.",
                      "idempotency_key": "00000000-0000-4000-8000-000000000002",
                      "job_kind": "answer",
                      "delivery_target": "answer",
                      "base_ref": "",
                      "context_message_ids": [],
                      "context_attachment_ids": [],
                    }
              required:
                - payload
            encoding:
              payload:
                contentType: application/json
