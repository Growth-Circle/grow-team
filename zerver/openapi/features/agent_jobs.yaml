              - type: object
                additionalProperties: false
                properties:
                  check_id:
                    type: string
                  attempt_id:
                    type: string
                    format: uuid
                  tree_hash:
                    type: string
                  command:
                    type: array
                    items:
                      type: string
                      minLength: 1
                      maxLength: 4096
                  cwd:
                    type: string
                  outcome:
                    type: string
                    enum:
                      - passing
                      - failed
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                  output_artifact_id:
                    type: string
                    format: uuid
                required:
                  - check_id
                  - attempt_id
                  - tree_hash
                  - command
                  - cwd
                  - outcome
                  - started_at
                  - finished_at
                  - output_artifact_id
        operations_cursor:
          $ref: "#/components/schemas/AgentSettingsEvidenceCursor"
        artifacts_cursor:
          $ref: "#/components/schemas/AgentSettingsEvidenceCursor"
      required:
        - result
        - msg
        - schema_version
        - job
        - attempts
        - operations
        - artifacts
        - required_checks
        - operations_cursor
        - artifacts_cursor
