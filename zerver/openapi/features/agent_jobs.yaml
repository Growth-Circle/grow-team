paths:
  /agent/jobs:
    get:
      operationId: list-agent-jobs
      tags:
        - agents
      summary: List agent jobs
      description: |
        **Changes**: In Zulip 12.0, added `result_message_id`, `step_label`,
        `progress`, and `artifacts` to each job object, and `runner_offline`
        as a `reason_code` for a queued job whose runner is silent (feature
        level ZF-157392).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanJobsResponse"
              example:
                result: success
                msg: ''
                schema_version: 1
                count: 0
                jobs: []
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version. Runner credential rejection includes it.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AgentHumanFrameworkError"
                  - $ref: "#/components/schemas/AgentHumanSafeError"
              examples:
                missing_authentication:
                  value:
                    result: error
                    msg: "Not logged in: API authentication or user session required"
                    code: UNAUTHORIZED
                runner_credential:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: INVALID_API_KEY
        "403":
          description:
            This REST route is CSRF exempt. The server defines no endpoint-specific 403 response
            envelope.
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
      parameters:
        - name: offset
          in: query
          description: Number of results to skip.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: view
          in: query
          description:
            Which tasks to return. "waiting" is those that wait for an approval or
            input the reader can give. Defaults to "all".
          schema:
            type: string
            enum:
              - mine
              - waiting
              - running
              - all
    post:
      operationId: create-agent-job
      tags:
        - agents
      summary: Create an agent job
      description: |
        **Changes**: In Zulip 12.0, added `result_message_id`, `step_label`,
        `progress`, and `artifacts` to the returned job object. A user whose
        role cannot give tasks to agents gets an error (feature level
        ZF-157392).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanJobResponse"
              example:
                result: success
                msg: ''
                schema_version: 1
                job:
                  id: 00000000-0000-4000-8000-000000000010
                  profile_id: 00000000-0000-4000-8000-000000000011
                  requester_id: 1
                  source_message_id: 1
                  result_message_id: 2
                  status: draft
                  phase: inspect
                  step_label: inspect
                  progress: 0.15
                  artifacts: []
                  version: 1
                  request: Request
                  title: Title
                  job_kind: answer
                  delivery_target: answer
                  blocked_reason: Blocked reason
                  reason_code: Reason code
                  resume_available: true
                  resume_unavailable_reason: attempt_active
                  needs_my_action: true
                  requirements: []
                  start_deadline: '2026-09-25T09:00:00Z'
                  result: {}
                  repository:
                    id: 00000000-0000-4000-8000-000000000012
                    alias: Alias
                  base_ref: Base ref
                  budget:
                    active_seconds: 1
                    tool_rounds: 1
                    input_tokens: 1
                    output_tokens: 1
                  instructions:
                    team_revision: 1
                    profile_revision: 1
                  follows_job_id: 00000000-0000-4000-8000-000000000013
                  allowed_actions: []
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version. Runner credential rejection includes it.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AgentHumanFrameworkError"
                  - $ref: "#/components/schemas/AgentHumanSafeError"
              examples:
                missing_authentication:
                  value:
                    result: error
                    msg: "Not logged in: API authentication or user session required"
                    code: UNAUTHORIZED
                runner_credential:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: INVALID_API_KEY
        "403":
          description:
            This REST route is CSRF exempt. The server defines no endpoint-specific 403 response
            envelope.
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
