                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                payload:
                  allOf:
                    - $ref: "#/components/schemas/AgentHumanApprovalDecisionRequest"
                  description:
                    Send exactly one form field named payload. Its value is the serialized JSON
                    request object.
                  example:
                    {
                      "schema_version": 1,
                      "expected_version": 1,
                      "operation_hash": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                      "nonce": "00000000-0000-4000-8000-000000000004",
                      "decision": "approved",
                    }
              required:
                - payload
            encoding:
              payload:
                contentType: application/json
      parameters:
        - name: approval_id
          in: path
          description: The ID of the agent approval.
          required: true
          schema:
            type: string
            format: uuid
  /agent/artifacts/{artifact_id}:
    get:
      operationId: download-agent-artifact
      tags:
        - agents
      summary: Download an agent job artifact
      responses:
        "200":
          description: Private artifact bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                  - nosniff
            Cache-Control:
              schema:
                type: string
                enum:
                  - private, no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version. Runner credential rejection includes it.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AgentHumanFrameworkError"
                  - $ref: "#/components/schemas/AgentHumanSafeError"
              examples:
                missing_authentication:
                  value:
                    result: error
                    msg: "Not logged in: API authentication or user session required"
                    code: UNAUTHORIZED
                runner_credential:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: INVALID_API_KEY
        "403":
          description:
            This REST route is CSRF exempt. The server defines no endpoint-specific 403 response
            envelope.
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
      parameters:
        - name: artifact_id
          in: path
          description: The ID of the agent job artifact.
          required: true
          schema:
            type: string
            format: uuid

