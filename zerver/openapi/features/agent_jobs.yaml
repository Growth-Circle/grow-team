    AgentHumanJob:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        requester_id:
          type: integer
          minimum: 1
        source_message_id:
          type: integer
          minimum: 1
          nullable: true
        result_message_id:
          type: integer
          minimum: 1
          nullable: true
          description:
            The job's one card message (spec 13). It stays the card when the
            result goes to the requester directly. Null for a draft job, and
            until the server posts the card.
        status:
          type: string
          enum:
            - draft
            - queued
            - running
            - waiting_for_input
            - waiting_for_approval
            - blocked
            - verifying
            - cancel_requested
            - cancelled
            - interrupted
            - failed
            - completed
        phase:
          type: string
          enum:
            - inspect
            - plan
            - edit
            - verify
            - review
            - deliver
        step_label:
          type: string
          description: The type of the job's latest activity event, such as
            `job.queued` or `tool.started`, or the phase before the job has any
            event. A client turns this stable code into its own step label text.
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: 0.05 while queued, 1 once completed, otherwise by phase
            (inspect 0.15, plan 0.3, edit 0.55, verify 0.75, review 0.9, deliver
            0.95).
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                  - task
                  - file
                  - pr
                  - check
              label:
                type: string
              url:
                type: string
                nullable: true
              task_id:
                type: integer
                nullable: true
            required:
              - kind
              - label
              - url
              - task_id
          description: Chips the card shows for this job's outcome, from what the
            job already has. A `task` chip names a linked task board card by
            `task_id`. A `file` chip links a file, including the full text of an
            answer that is too long for one message. A `pr` chip links a draft
            pull request. A `check` chip links a required check's output.
        version:
          type: integer
          minimum: 1
        request:
          type: string
        job_kind:
          type: string
          enum:
            - answer
            - code
            - manage
        delivery_target:
          type: string
          enum:
            - answer
            - patch
            - draft_pr
        blocked_reason:
          type: string
        title:
          type: string
          description: The first 80 characters of the task's request text.
        reason_code:
          type: string
          nullable: true
          description:
            A stable code for why a blocked, interrupted, failed, or verifying
            job is in that state, such as start_deadline_expired, stop_unconfirmed,
            runtime_stopped, lease_lost, start_failed, result_invalid,
            verification_failed, publication_blocked, publication_timeout,
            audience_changed, profile_needs_action, budget_exhausted,
            approval_expired, approval_rejected, or authority_changed. A queued
            job whose runner sent no heartbeat in the last 45 seconds has
            runner_offline. Null when the status carries no such reason.
        resume_available:
          type: boolean
          description: The Resume action shows only when this is true.
        resume_unavailable_reason:
          type: string
          nullable: true
          enum:
            - attempt_active
            - runner_offline
            - runner_revoked
            - null
          description: Why resume is unavailable. Null when resume_available is true.
        needs_my_action:
          type: boolean
          description: The reader can give this job the approval or input it waits for.
        requirements:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
              surface:
                type: string
              action:
                type: string
            required:
              - code
              - surface
              - action
        start_deadline:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        repository:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            alias:
              type: string
          required:
            - id
            - alias
        base_ref:
          type: string
        budget:
          type: object
          additionalProperties: false
          properties:
            active_seconds:
              type: integer
              minimum: 1
            tool_rounds:
              type: integer
              minimum: 1
            input_tokens:
              type: integer
              minimum: 1
            output_tokens:
              type: integer
              minimum: 1
          required:
            - active_seconds
            - tool_rounds
            - input_tokens
            - output_tokens
        instructions:
          type: object
          nullable: true
          additionalProperties: false
          description: Instruction revisions the latest attempt started with. Null
            without an attempt, or without any instructions.
          properties:
            team_revision:
              type: integer
              minimum: 1
              nullable: true
            profile_revision:
              type: integer
              minimum: 1
              nullable: true
          required:
            - team_revision
            - profile_revision
        follows_job_id:
          type: string
          format: uuid
          nullable: true
        allowed_actions:
          type: array
          items:
            type: string
            enum:
              - cancel
              - configure
              - resume
              - input
              - deliver_privately
              - follow_up
          description: The server calculates these actions for the current caller.
      required:
        - id
        - profile_id
        - requester_id
        - source_message_id
        - result_message_id
        - status
        - phase
        - step_label
        - progress
        - artifacts
        - version
        - request
        - title
        - job_kind
        - delivery_target
        - blocked_reason
        - reason_code
        - resume_available
        - resume_unavailable_reason
        - needs_my_action
        - requirements
        - start_deadline
        - result
        - repository
        - base_ref
        - budget
        - instructions
        - follows_job_id
        - allowed_actions
