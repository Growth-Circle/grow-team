            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                payload:
                  allOf:
                    - $ref: "#/components/schemas/AgentHumanCreateJobRequest"
                  description:
                    Send exactly one form field named payload. Its value is the serialized JSON
                    request object.
                  example:
                    {
                      "schema_version": 1,
                      "profile_id": "00000000-0000-4000-8000-000000000001",
                      "source_message_id": 9,
                      "repository_id": null,
                      "request": "Summarize this thread.",
                      "idempotency_key": "00000000-0000-4000-8000-000000000002",
                      "job_kind": "answer",
                      "delivery_target": "answer",
                      "base_ref": "",
                      "context_message_ids": [],
                      "context_attachment_ids": [],
                    }
              required:
                - payload
            encoding:
              payload:
