components:
  schemas:
    AgentHumanTestTaskRequest:
      additionalProperties: false
      properties:
        schema_version:
          title: Schema Version
          type: integer
          enum:
            - 1
        idempotency_key:
          format: uuid
          title: Idempotency Key
          type: string
      required:
        - schema_version
        - idempotency_key
      title: TestTask
      type: object
    AgentSettingsNetworkPolicy:
      additionalProperties: false
      properties:
        targets:
          items:
            $ref: "#/components/schemas/AgentSettingsNetworkTarget"
          maxItems: 32
          title: Targets
          type: array
        public_https_only:
          default: true
          title: Public Https Only
          type: boolean
          enum:
            - true
        block_metadata:
          default: true
          title: Block Metadata
          type: boolean
          enum:
            - true
        cross_origin_authorization:
          default: false
          title: Cross Origin Authorization
          type: boolean
          enum:
            - false
        project_network:
          default: false
          title: Project Network
          type: boolean
          enum:
            - false
      title: NetworkPolicy
      type: object
    AgentSettingsNetworkTarget:
      additionalProperties: false
      properties:
        hostname:
          maxLength: 253
          minLength: 1
          pattern: ^[a-zA-Z0-9.:-]+$
          title: Hostname
          type: string
        port:
          maximum: 65535
          minimum: 1
          title: Port
          type: integer
        allow_private:
          default: false
          title: Allow Private
          type: boolean
        allow_http_loopback:
          default: false
          title: Allow Http Loopback
          type: boolean
        allow_http_private:
          default: false
          title: Allow Http Private
          type: boolean
      required:
        - hostname
        - port
      title: NetworkTarget
      type: object
    AgentSettingsProviderCreateRequest:
      additionalProperties: false
      properties:
        schema_version:
          title: Schema Version
          type: integer
          enum:
            - 1
        runner_id:
          format: uuid
          title: Runner Id
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        base_url:
          maxLength: 2048
          minLength: 1
          title: Base Url
          type: string
        model_id:
          maxLength: 200
          minLength: 1
          title: Model Id
          type: string
        allowed_models:
          items:
            maxLength: 4096
            minLength: 1
            type: string
          maxItems: 100
          minItems: 1
          title: Allowed Models
          type: array
        context_window_tokens:
          maximum: 2147483647
          minimum: 1
          title: Context Window Tokens
          type: integer
        max_output_tokens:
          maximum: 2147483647
          minimum: 1
          title: Max Output Tokens
          type: integer
        credential:
          default: null
          title: Credential
          maxLength: 4096
          minLength: 1
          type: string
          nullable: true
        local_credential_ref:
          default: ""
          maxLength: 200
          title: Local Credential Ref
          type: string
        api_mode:
          default: chat_completions
          enum:
            - chat_completions
            - responses
          title: Api Mode
          type: string
        network:
          $ref: "#/components/schemas/AgentSettingsNetworkPolicy"
        data_scope:
          default:
            - synthetic
          items:
            enum:
              - synthetic
              - selected_chat
              - selected_repository
            type: string
          title: Data Scope
          type: array
      required:
        - schema_version
        - runner_id
        - name
        - base_url
        - model_id
        - allowed_models
        - context_window_tokens
        - max_output_tokens
      title: ProviderCreate
      type: object
      oneOf:
        - required:
            - credential
          properties:
            credential:
              type: string
              minLength: 1
            local_credential_ref:
              type: string
              enum:
                - ""
        - required:
            - local_credential_ref
          properties:
            credential:
              type: object
              nullable: true
              enum:
                - null
            local_credential_ref:
              type: string
              minLength: 1
      description: "Set exactly one credential source: credential or local_credential_ref."
    AgentSettingsProviderUpdateRequest:
      additionalProperties: false
      properties:
        schema_version:
          title: Schema Version
          type: integer
          enum:
            - 1
        expected_config_version:
          minimum: 1
          title: Expected Config Version
          type: integer
        expected_metadata_revision:
          minimum: 1
          title: Expected Metadata Revision
          type: integer
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        base_url:
          maxLength: 2048
          minLength: 1
          title: Base Url
          type: string
        model_id:
          maxLength: 200
          minLength: 1
          title: Model Id
          type: string
        allowed_models:
          items:
            maxLength: 4096
            minLength: 1
            type: string
          maxItems: 100
          minItems: 1
          title: Allowed Models
          type: array
        context_window_tokens:
          maximum: 2147483647
          minimum: 1
          title: Context Window Tokens
          type: integer
        max_output_tokens:
          maximum: 2147483647
          minimum: 1
          title: Max Output Tokens
          type: integer
        credential_replacement:
          default: null
          title: Credential Replacement
          maxLength: 4096
          minLength: 1
          type: string
