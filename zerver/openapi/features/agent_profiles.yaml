                  base_ref: Base ref
                  budget:
                    active_seconds: 1
                    tool_rounds: 1
                    input_tokens: 1
                    output_tokens: 1
                  instructions:
                    team_revision: 1
                    profile_revision: 1
                  follows_job_id: 00000000-0000-4000-8000-000000000039
                  allowed_actions: []
        "400":
          description: The agent wrapper rejected a parsed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Authentication can fail before the agent wrapper. Standard authentication errors
            omit schema_version. Runner credential rejection includes it.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AgentHumanFrameworkError"
                  - $ref: "#/components/schemas/AgentHumanSafeError"
              examples:
                missing_authentication:
                  value:
                    result: error
                    msg: "Not logged in: API authentication or user session required"
                    code: UNAUTHORIZED
                runner_credential:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: INVALID_API_KEY
        "403":
          description:
            This REST route is CSRF exempt. The server defines no endpoint-specific 403 response
            envelope.
        "405":
          description:
            REST dispatch returns permitted methods in the body and Allow header. GET routes
            also permit HEAD.
          headers:
            Allow:
              schema:
                type: string
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/AgentHumanMethodNotAllowedError"
        "429":
          description: Authentication-wrapper rate limiting returns a standard error envelope.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanRateLimitError"
              example:
                result: error
                msg: API usage exceeded rate limit; see https://zulip.com/api/http-headers#rate-limiting-response-headers
                code: RATE_LIMIT_HIT
                retry-after: 30
        "503":
          description: Agent authority is busy. Retry after one second.
          headers:
            Retry-After:
              schema:
                type: string
                enum:
                  - "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHumanSafeError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
                schema_version: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                payload:
                  allOf:
                    - $ref: "#/components/schemas/AgentHumanTestTaskRequest"
                  description:
                    Send exactly one form field named payload. Its value is the serialized JSON
                    request object.
                  example: {"schema_version": 1, "idempotency_key": "5e8f1620-3e29-4b7e-9a1d-2c6b8f0a7d11"}
              required:
                - payload
            encoding:
              payload:
                contentType: application/json
      parameters:
        - name: profile_id
          in: path
          description: The ID of the agent profile.
          required: true
          schema:
            type: string
            format: uuid
