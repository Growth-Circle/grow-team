      tags:
        - agents
      summary: Create an agent profile
      description: |
        Create an agent profile and start the runner's readiness probe.

        A user who has no access to a runner can still create an `answer`
        agent on the organization's work runner, if they may create agents.
        The server then picks the model provider and the harness. A `code`
        or `manage` agent needs access to the runner.

