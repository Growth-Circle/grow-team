  /agent/pairings:
    post:
      operationId: create-agent-pairing
      summary: Create a device pairing request
      tags: ["agent device connections"]
      description: |
        Create an anonymous pairing request for one device.

        This endpoint does not use Zulip Basic authentication or browser sessions.
        It accepts only the exact JSON envelope in a body of at most 65,536 bytes.
        The caller must retain `polling_secret` locally. The server never returns that secret.

        A signed-in owner approves the displayed user code through a separate human
        endpoint. Approval requires the realm agent feature flag to be enabled. A
        pairing request alone has no realm, owner, runner, provider, repository, or
        profile authority.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPairingStartRequest"
      responses:
        "200":
          description: Pairing request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPairingStartResponse"
              example:
                result: success
                msg: Msg
                schema_version: 1
                pairing_id: 00000000-0000-4000-8000-000000000004
                state: pending
                user_code: User code
                expires_at: '2026-09-25T09:00:00Z'
        "400":
          description: The envelope, field type, or pairing value is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
        "405":
          description: Only POST is supported.
        "429":
          description: The IP pairing limit was exceeded. Retry after the response header delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
  /agent/pairings/status:
    post:
      operationId: get-agent-pairing-status
      summary: Get a device pairing status
      tags: ["agent device connections"]
      description: |
        Return the state of one pairing request. This endpoint does not use Zulip
        Basic authentication or browser sessions. The caller must send the original
        pairing ID and polling secret in an exact JSON envelope of at most 65,536
        bytes.

        The response never contains access or refresh credentials. An exchanged
        pairing with a lost exchange response requires a new pairing and owner
        revocation of the orphan runner.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPairingCredentialRequest"
      responses:
        "200":
          description: Current pairing status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPairingStatusResponse"
              example:
                result: success
                msg: Msg
                schema_version: 1
                pairing_id: 00000000-0000-4000-8000-000000000005
                state: pending
                expires_at: '2026-09-25T09:00:00Z'
                runner_id: 00000000-0000-4000-8000-000000000006
                recovery: poll
        "400":
          description: The pairing is unavailable, or the envelope or secret is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
        "405":
          description: Only POST is supported.
        "429":
          description: The IP exchange-status limit was exceeded. Retry after the response header delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
  /agent/pairings/exchange:
    post:
      operationId: exchange-agent-pairing
      summary: Exchange an approved device pairing
      tags: ["agent device connections"]
      description: |
        Exchange one approved, unexpired pairing for an access credential and refresh
        credential. This endpoint does not use Zulip Basic authentication or browser
        sessions. It accepts only the exact JSON envelope in a body of at most 65,536
        bytes.

        The exchange consumes the pairing. Treat a lost success response as uncertain.
        Do not retry the exchange. Query pairing status, then create a new pairing and
        revoke the orphan runner if the pairing was exchanged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPairingCredentialRequest"
      responses:
        "200":
          description: New runner credentials. Store both values only in private device storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerCredentialResponse"
              example:
                result: success
                msg: Msg
                schema_version: 1
                token: Token
                refresh_token: Refresh token
                runner_id: 00000000-0000-4000-8000-000000000007
                expires_at: '2026-09-25T09:00:00Z'
                refresh_expires_at: '2026-09-25T09:00:00Z'
        "400":
          description: The pairing is unavailable, unapproved, expired, consumed, or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
        "405":
          description: Only POST is supported.
        "429":
          description: The IP exchange-status limit was exceeded. Retry after the response header delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
  /agent/runner/token/refresh:
    post:
      operationId: refresh-agent-runner-token
      summary: Rotate an agent runner credential
      tags: ["agent device connections"]
      description: |
        Rotate a runner credential with the refresh credential in the JSON body. This
        endpoint does not use an access bearer credential, Zulip Basic authentication,
        or browser sessions. The exact JSON body can contain at most 65,536 bytes.

        A successful request revokes the supplied refresh credential and returns a new
        access credential and refresh credential. Treat a lost success response as
        uncertain. Do not replay the old refresh credential. Re-pair the device and
        revoke an orphan runner when recovery requires it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunnerRefreshRequest"
      responses:
        "200":
          description: Rotated runner credentials. Store both values only in private device storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerCredentialResponse"
              example:
                result: success
                msg: Msg
                schema_version: 1
                token: Token
                refresh_token: Refresh token
                runner_id: 00000000-0000-4000-8000-000000000008
                expires_at: '2026-09-25T09:00:00Z'
                refresh_expires_at: '2026-09-25T09:00:00Z'
        "400":
          description: The envelope or refresh credential is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
        "401":
          description: The refresh credential is invalid, expired, revoked, or belongs to a revoked runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerCredentialError"
              example:
                result: error
                msg: Msg
                schema_version: 1
                code: credential_invalid
        "405":
          description: Only POST is supported.
        "429":
          description: The IP exchange-status limit was exceeded. Retry after the response header delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
  /agent/runner/workspaces:
    post:
      operationId: register-agent-runner-workspace
      summary: Register an agent runner workspace
      tags: ["agent device connections"]
      description: |
        Create or revise owner-approved repository metadata for the authenticated
        runner. Send an active runner access credential in `Authorization: Bearer`.
        Browser sessions and Zulip Basic authentication are rejected.

        The API never accepts a local path. `canonical_origin` must be an HTTPS or
        SSH origin without credentials, query, fragment, `file:` prefix, home prefix,
        or absolute path. The request creates revision 1. An exact replay at the
        current revision succeeds. A changed request must use the current revision
        plus one. Other revisions fail. A changed workspace invalidates readiness for
        profiles that use it.
      security:
        - AgentRunnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunnerWorkspaceRequest"
      responses:
        "200":
          description: Repository metadata registered or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerWorkspaceResponse"
              example:
                result: success
                msg: Msg
                schema_version: 1
                repository:
                  id: 00000000-0000-4000-8000-000000000009
                  workspace_alias: Workspace alias
                  revision: 1
                  policy_version: 1
        "400":
          description: The envelope, origin, required check, revision, or runner ownership is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Msg
                schema_version: 1
        "401":
          description: The runner bearer credential is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerCredentialError"
              example:
                result: error
                msg: Msg
                schema_version: 1
                code: credential_invalid
        "405":
          description: Only POST is supported.
  /agent/runner/catalog:
    post:
      operationId: update-agent-runner-catalog
      summary: Update an agent runner catalog
      tags: ["agent device connections"]
      description: |
        Register the authenticated runner catalog. Send an active runner access
        credential in `Authorization: Bearer`. Browser sessions and Zulip Basic
        authentication are rejected. The exact JSON body can contain at most 65,536
        bytes.

        An exact replay at the current catalog revision succeeds. A lower revision or
        a different catalog at the current revision fails. A changed catalog must use
        a higher revision. Every sandbox item must carry that catalog revision. A
        changed catalog invalidates readiness for profiles on this runner.
      security:
        - AgentRunnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunnerCatalogRequest"
      responses:
        "200":
          description: Catalog stored or exactly replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerCatalogResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
                catalog_revision: 1
        "400":
          description: The envelope, catalog, sandbox revision, or revision ordering is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description: The runner bearer credential is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AgentDeviceError"
                  - $ref: "#/components/schemas/AgentRunnerCredentialError"
              examples:
                missing:
                  value:
                    result: error
                    msg: Runner authentication is required.
                    schema_version: 1
                rejected:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: credential_invalid
        "405":
          description: Only POST is supported.
  /agent/runner/drafts:
    post:
      operationId: agent-runtime-draft
      summary: Publish a draft update for a job
      tags:
        - agent device connections
      description:
        "Require the current lease and job version. Replace the visible draft text for the job's card.
        Use the /api/v1 path. Basic authentication and authenticated browser sessions are rejected. Send
        the runner credential in Authorization: Bearer <token>. Unknown JSON fields are rejected."
      security:
        - AgentRunnerBearer: []
      servers:
        - url: /api/v1
      responses:
        "200":
          description: Successful request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettingsEmptyResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
        "400":
          description: Malformed input, stale versions, unavailable resources, or rejected authority.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Missing bearer or rejected browser session uses an uncoded error. Rejected credentials
            use the coded credential error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AgentDeviceError"
                  - $ref: "#/components/schemas/AgentRunnerCredentialError"
              examples:
                missing:
                  value:
                    result: error
                    msg: Runner authentication is required.
                    schema_version: 1
                rejected:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: credential_invalid
        "405":
          description: Unsupported HTTP method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Method is not supported.
                schema_version: 1
      requestBody:
        required: true
        description: Send the versioned object directly as JSON. Do not wrap it in a form payload field.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRuntimeDraftRequest"
            example:
              schema_version: 1
              job_id: 00000000-0000-4000-8000-000000000001
              attempt_id: 00000000-0000-4000-8000-000000000001
              lease_epoch: 1
              job_version: 1
              text: Draft text visible on the job card.
