      description:
        "Only attempt.stopped with stop_confirmed true is accepted. Cleanup carries no summary
        or adapter session reference. The server assigns the journal sequence. Exact receipt replay is accepted.
        A narrowly scoped, unexpired revocation credential can report stop evidence. This exception grants
        no execution authority. Rotated or expired credentials do not qualify. Missing bearer credentials
        and authenticated browser sessions return 401. Rejected credentials or invalid revocation evidence
        return an uncoded 400 error. Use the /api/v1 path. Basic authentication and authenticated browser
        sessions are rejected. Send the runner credential in Authorization: Bearer <token>. Unknown JSON
        fields are rejected."
