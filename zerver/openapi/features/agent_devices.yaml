        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRuntimeStopEvidenceRequest"
            example:
              schema_version: 1
              event:
                schema_version: 1
                job_id: 00000000-0000-4000-8000-000000000005
                attempt_id: 00000000-0000-4000-8000-000000000006
                lease_epoch: 1
