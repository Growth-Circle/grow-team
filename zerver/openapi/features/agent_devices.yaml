      operationId: agent-runtime-events
      summary: Record an execution event batch
      tags:
        - agent device connections
      description:
        "All events must use one job, attempt, and lease epoch. Apply the returned job version
        to the next event. Event IDs and sequences bind replay. The server rejects conflicting retries.
        Use the /api/v1 path. Basic authentication and authenticated browser sessions are rejected. Send
        the runner credential in Authorization: Bearer <token>. Unknown JSON fields are rejected."
      security:
        - AgentRunnerBearer: []
      servers:
        - url: /api/v1
      responses:
        "200":
          description: Successful request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRuntimeEventsResponse"
              example:
                result: success
                msg: ""
                schema_version: 1
                receipts:
                  - event_sequence: 1
                    job_version: 1
                    status: draft
        "400":
          description: Malformed input, stale versions, unavailable resources, or rejected authority.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Agent request rejected.
                schema_version: 1
        "401":
          description:
            Missing bearer or rejected browser session uses an uncoded error. Rejected credentials
            use the coded credential error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AgentDeviceError"
                  - $ref: "#/components/schemas/AgentRunnerCredentialError"
              examples:
                missing:
                  value:
                    result: error
                    msg: Runner authentication is required.
                    schema_version: 1
                rejected:
                  value:
                    result: error
                    msg: Runner credential rejected.
                    schema_version: 1
                    code: credential_invalid
        "405":
          description: Unsupported HTTP method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Method is not supported.
                schema_version: 1
        "503":
          description: Authority lock is busy. Retry after one second.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceError"
              example:
                result: error
                msg: Agent authority is busy. Retry this request.
