paths:
  /mcp/access:
    get:
      operationId: list-mcp-access
      tags: ["users"]
      summary: List your external MCP connections
      description: |
        Return your active connections and up to 100 recent connections.
        Each connection uses your account permissions. Tokens are never returned.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - type: object
                    additionalProperties: false
                    required: [url, connections]
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      url:
                        type: string
                        description: The canonical MCP endpoint.
                      connections:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            [
                              id,
                              name,
                              method,
                              scopes,
                              created_at,
                              expires_at,
                              last_used_at,
                              revoked,
                              expired,
                            ]
                          properties:
                            id: {type: string}
                            name: {type: string}
                            method: {type: string, enum: [oauth, token]}
                            scopes: {type: array, items: {type: string}}
                            created_at: {type: string}
                            expires_at: {type: string}
                            last_used_at: {type: string, nullable: true}
                            revoked: {type: boolean}
                            expired: {type: boolean}
              example:
                result: success
                msg: ""
                url: https://team.growc.id/mcp
                connections: []
    post:
      operationId: create-mcp-access
      tags: ["users"]
      summary: Create an external agent token
      description: |
        Create a personal token that expires after 90 days.
        The response shows the token once. Store it in your agent's secret settings.
        Only members can create tokens. Guests and bots cannot create them.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The external agent's name.
                  example: Hermes
                write:
                  type: string
                  enum: ["true", "false"]
                  default: "false"
                  description: Allow channel messages and task changes as your account.
                  example: "false"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - type: object
                    additionalProperties: false
                    required: [id, token, expires_at]
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      id: {type: string}
                      token: {type: string}
                      expires_at: {type: string}
              example:
                result: success
                msg: ""
                id: 00000000-0000-4000-8000-000000000001
                token: example-token
                expires_at: "2026-12-31T00:00:00+00:00"
  /mcp/access/{grant_id}/revoke:
    post:
      operationId: revoke-mcp-access
      tags: ["users"]
      summary: Revoke an external MCP connection
      description: |
        Revoke your connection and all its tokens. You cannot revoke another account's connection.
        An operation that already started can finish.
      parameters:
        - name: grant_id
          in: path
          required: true
          description: The connection ID.
          schema: {type: string, format: uuid}
          example: 00000000-0000-4000-8000-000000000001
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSuccess"
              example:
                result: success
                msg: ""
  /mcp/calls/{call_id}/decision:
    post:
      operationId: decide-mcp-call
      tags: ["users"]
      summary: Approve or reject a call that waits for you
      description: |
        Decide a call an external client made to an Ask first tool. Only the
        owner of the connection can decide. Approving runs the stored
        arguments once, as you, and keeps the result for the client's retry.
        Nothing runs when the digest or nonce no longer match, the call
        expired, or the connection or tool no longer allows it: the response
        is 409, and 403 for anyone but the owner.

        The call, its `digest` and its `nonce` come from the `mcp_call` item
        of `GET /needs`.

        **Changes**: New in Zulip 12.0 (feature level ZF-49a7c5).
      parameters:
        - name: call_id
          in: path
          required: true
          description: The call's ID, from the `mcp_call` item.
          schema: {type: string, format: uuid}
          example: 00000000-0000-4000-8000-000000000002
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [decision, argument_digest, nonce]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                  description: Whether to run the call or turn it down.
                  example: approve
                argument_digest:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: The `operation_hash` of the item.
                  example: 1f0c5a9e77b21f0c5a9e77b21f0c5a9e77b21f0c5a9e77b21f0c5a9e77b2aaaa
                nonce:
                  type: string
                  description: The `nonce` of the item.
                  example: 00000000-0000-4000-8000-000000000003
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - type: object
                    additionalProperties: false
                    required: [id, status, digest]
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      id: {type: string}
                      status:
                        type: string
                        enum: [executed, failed, rejected]
                      digest: {type: string}
              example:
                result: success
                msg: ""
                id: 00000000-0000-4000-8000-000000000002
                status: executed
                digest: 1f0c5a9e77b2
