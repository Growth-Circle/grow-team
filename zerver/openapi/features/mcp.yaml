paths:
  /mcp/access:
    get:
      operationId: list-mcp-access
      tags: ["users"]
      summary: List your external MCP connections
      description: |
        Return your active connections and up to 100 recent connections.
        Each connection uses your account permissions. Tokens are never returned.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - type: object
                    additionalProperties: false
                    required: [url, connections]
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      url:
                        type: string
                        description: The canonical MCP endpoint.
                      connections:
                        type: array
                        description: "Your active connections and up to 100 recent ones."
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            [
                              id,
                              name,
                              method,
                              scopes,
                              policy_mode,
                              created_at,
                              expires_at,
                              last_used_at,
                              revoked,
                              expired,
                            ]
                          properties:
                            id:
                              {type: string, description: "The connection ID."}
                            name:
                              {
                                type: string,
                                description: "The name of the connection.",
                              }
                            method:
                              type: string
                              enum: [oauth, token]
                              description: "`oauth` for a connection made by signing in, `token` for a personal token."
                            scopes:
                              type: array
                              items: {type: string}
                              description: "What the connection may do. `team:read` always, and `team:write` when it may also change things."
                            policy_mode:
                              type: string
                              enum: [managed, legacy]
                              description: |
                                `legacy` for a connection made before per-tool
                                policies: it keeps the access its scopes give
                                it until its owner changes a policy. A new
                                connection is `managed`.

                                **Changes**: New in Zulip 12.0 (feature level ZF-49a7c5).
                            created_at:
                              type: string
                              description: "When the connection was made, as an ISO 8601 timestamp."
                            expires_at:
                              type: string
                              description: "When the connection stops working, as an ISO 8601 timestamp."
                            last_used_at:
                              type: string
                              nullable: true
                              description: "When a call last used the connection, or `null` if none has."
                            revoked:
                              type: boolean
                              description: "Whether you revoked the connection."
                            expired:
                              type: boolean
                              description: "Whether the connection has passed its `expires_at`."
              example:
                result: success
                msg: ""
                url: https://team.growc.id/mcp
                connections: []
    post:
      operationId: create-mcp-access
      tags: ["users"]
      summary: Create an external agent token
      description: |
        Create a personal token that expires after 90 days.
        The response shows the token once. Store it in your agent's secret settings.
        Only members can create tokens. Guests and bots cannot create them.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The external agent's name.
                  example: Hermes
                write:
                  type: string
                  enum: ["true", "false"]
                  default: "false"
                  description: Allow channel messages and task changes as your account.
                  example: "false"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - type: object
                    additionalProperties: false
                    required: [id, token, expires_at]
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      id:
                        {
                          type: string,
                          description: "The ID of the new connection.",
                        }
                      token:
                        type: string
                        description: "The token. It is shown once and cannot be read again."
                      expires_at:
                        type: string
                        description: "When the token expires, 90 days after creation, as an ISO 8601 timestamp."
              example:
                result: success
                msg: ""
                id: 00000000-0000-4000-8000-000000000001
                token: example-token
                expires_at: "2026-12-31T00:00:00+00:00"
  /mcp/access/{grant_id}/revoke:
    post:
      operationId: revoke-mcp-access
      tags: ["users"]
      summary: Revoke an external MCP connection
      description: |
        Revoke your connection and all its tokens. You cannot revoke another account's connection.
        An operation that already started can finish.
      parameters:
        - name: grant_id
          in: path
          required: true
          description: The connection ID.
          schema: {type: string, format: uuid}
          example: 00000000-0000-4000-8000-000000000001
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSuccess"
              example:
                result: success
                msg: ""
  /mcp/access/{grant_id}/tools:
    get:
      operationId: get-mcp-access-tools
      tags: ["users"]
      summary: List the tools of your external MCP connection
      description: |
        Return the tools your connection can use, each with its policy:
        `allow` (Auto), `approve` (Ask first) or `block` (Off). A tool that is
        not shown needs write access the connection does not have.

        `enforced` is `false` while the workspace has not turned policies on,
        and for a `legacy` connection. Policies are saved either way.

        **Changes**: New in Zulip 12.0 (feature level ZF-49a7c5).
      parameters:
        - name: grant_id
          in: path
          required: true
          description: The connection ID. It must be your own, and not revoked.
          schema: {type: string, format: uuid}
          example: 00000000-0000-4000-8000-000000000001
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - $ref: "#/components/schemas/McpAccessTools"
              example:
                result: success
                msg: ""
                grant:
                  id: 00000000-0000-4000-8000-000000000001
                  name: Claude Cowork
                  policy_mode: managed
                enforced: true
                tools:
                  - name: get_me
                    description: Read the profile of the account that approved this connection.
                    kind: read
                    policy: allow
                    default_policy: allow
                  - name: send_message
                    description: Send a channel message as the approved account.
                    kind: write
                    policy: approve
                    default_policy: approve
    put:
      operationId: update-mcp-access-tools
      tags: ["users"]
      summary: Change the policies of your external MCP connection
      description: |
        Set the policy of one or more tools. Only the owner of the connection
        can change it; an administrator can revoke a connection but not loosen
        it. A `legacy` connection becomes `managed`, with every tool it could
        use kept on `allow`, so changing one tool changes no other.

        A read tool (`kind` is `read`) cannot be `approve`: it has no preview
        to approve.

        Each change that alters a policy adds an audit entry with `outcome`
        `policy_changed`.

        **Changes**: New in Zulip 12.0 (feature level ZF-49a7c5).
      parameters:
        - name: grant_id
          in: path
          required: true
          description: The connection ID. It must be your own, and not revoked.
          schema: {type: string, format: uuid}
          example: 00000000-0000-4000-8000-000000000001
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                policies:
                  description: |
                    A JSON-encoded object that maps a tool name to its new
                    policy.
                  type: object
                  additionalProperties:
                    type: string
                    enum: [allow, approve, block]
                  example: {send_message: approve, delete_task: block}
              required:
                - policies
            encoding:
              policies:
                contentType: application/json
      responses:
        "200":
          description: Success. The body is the same as `GET` returns.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - $ref: "#/components/schemas/McpAccessTools"
              example:
                result: success
                msg: ""
                grant:
                  id: 00000000-0000-4000-8000-000000000001
                  name: Claude Cowork
                  policy_mode: managed
                enforced: true
                tools:
                  - name: send_message
                    description: Send a channel message as the approved account.
                    kind: write
                    policy: block
                    default_policy: approve
  /mcp/audit:
    get:
      operationId: list-mcp-audit
      tags: ["users"]
      summary: List what happened to external MCP calls
      description: |
        Return the newest entries first: calls that were blocked, asked for,
        approved, declined, executed, rate limited or that failed, and
        policy changes. You see the connections you own; an administrator
        sees all of them. An entry never holds the content of a call or a
        token: `digest` is the first 12 characters of a hash of its arguments.

        **Changes**: New in Zulip 12.0 (feature level ZF-49a7c5).
      parameters:
        - name: limit
          in: query
          description: How many entries to return, from 1 to 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
          example: 50
        - name: before
          in: query
          description: Only entries with an `id` below this one, to read the next page.
          schema: {type: integer}
          example: 120
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - type: object
                    additionalProperties: false
                    required: [entries, has_more]
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      has_more:
                        type: boolean
                        description: "Whether older entries exist. Pass the last `id` as `before` to read them."
                      entries:
                        type: array
                        description: "The entries, newest first."
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            [
                              id,
                              created_at,
                              connection,
                              owner,
                              tool,
                              outcome,
                              digest,
                              actor,
                              policy,
                            ]
                          properties:
                            id:
                              {
                                type: integer,
                                description: "The ID of the entry.",
                              }
                            created_at:
                              type: string
                              format: date-time
                              description: "When it happened."
                            connection:
                              {
                                type: string,
                                description: The connection's name.,
                              }
                            owner:
                              {
                                type: string,
                                description: The owner's full name.,
                              }
                            tool:
                              {
                                type: string,
                                description: "The tool the call used, or `token.revoke` when you revoked a connection.",
                              }
                            outcome:
                              type: string
                              description: "What happened to the call, such as `success`, `rejected`, `blocked`, `asked`, `executed`, `rate_limited` or `policy_changed`."
                            digest:
                              type: string
                              description: "The first 12 characters of a hash of the call arguments. Empty when the entry is not about a call with arguments."
                            actor:
                              type: string
                              nullable: true
                              description: Who decided, when a person did.
                            policy:
                              type: string
                              nullable: true
                              description: The new policy, for a `policy_changed` entry.
              example:
                result: success
                msg: ""
                has_more: false
                entries:
                  - id: 120
                    created_at: "2026-10-18T09:00:00+00:00"
                    connection: Claude Cowork
                    owner: Ari Eko
                    tool: send_message
                    outcome: asked
                    digest: 1f0c5a9e77b2
                    actor: Ari Eko
                    policy: null
  /mcp/calls/{call_id}/decision:
    post:
      operationId: decide-mcp-call
      tags: ["users"]
      summary: Approve or reject a call that waits for you
      description: |
        Decide a call an external client made to an Ask first tool. Only the
        owner of the connection can decide. Approving runs the stored
        arguments once, as you, and keeps the result for the client's retry.
        Nothing runs when the digest or nonce no longer match, the call
        expired, or the connection or tool no longer allows it: the response
        is 409, and 403 for anyone but the owner.

        The call, its `digest` and its `nonce` come from the `mcp_call` item
        of `GET /needs`.

        **Changes**: New in Zulip 12.0 (feature level ZF-49a7c5).
      parameters:
        - name: call_id
          in: path
          required: true
          description: The call's ID, from the `mcp_call` item.
          schema: {type: string, format: uuid}
          example: 00000000-0000-4000-8000-000000000002
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [decision, argument_digest, nonce]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                  description: Whether to run the call or turn it down.
                  example: approve
                argument_digest:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: The `operation_hash` of the item.
                  example: 1f0c5a9e77b21f0c5a9e77b21f0c5a9e77b21f0c5a9e77b21f0c5a9e77b2aaaa
                nonce:
                  type: string
                  description: The `nonce` of the item.
                  example: 00000000-0000-4000-8000-000000000003
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonSuccessBase"
                  - type: object
                    additionalProperties: false
                    required: [id, status, digest]
                    properties:
                      result: {}
                      msg: {}
                      ignored_parameters_unsupported: {}
                      id: {type: string, description: "The ID of the call."}
                      status:
                        type: string
                        enum: [executed, failed, rejected]
                        description: "What became of the call. `executed` when it ran, `failed` when it ran and failed, `rejected` when you declined it."
                      digest:
                        type: string
                        description: "The first 12 characters of a hash of the call arguments."
              example:
                result: success
                msg: ""
                id: 00000000-0000-4000-8000-000000000002
                status: executed
                digest: 1f0c5a9e77b2
components:
  schemas:
    McpAccessTools:
      type: object
      additionalProperties: false
      required: [grant, enforced, tools]
      properties:
        result: {}
        msg: {}
        ignored_parameters_unsupported: {}
        grant:
          type: object
          additionalProperties: false
          description: "The connection these tools belong to."
          required: [id, name, policy_mode]
          properties:
            id: {type: string, description: "The connection ID."}
            name: {type: string, description: "The name of the connection."}
            policy_mode:
              type: string
              enum: [managed, legacy]
              description: "`legacy` for a connection made before per-tool policies, `managed` otherwise."
        enforced:
          type: boolean
          description: Whether the workspace applies these policies to this connection now.
        tools:
          type: array
          description: "The tools the connection can use, with the policy each has now."
          items:
            type: object
            additionalProperties: false
            required: [name, description, kind, policy, default_policy]
            properties:
              name: {type: string, description: "The name of the tool."}
              description: {type: string, description: Plain text.}
              kind:
                type: string
                enum: [read, write, destructive]
                description: "What the tool does to the workspace. A `read` tool cannot be set to `approve`."
              policy:
                type: string
                enum: [allow, approve, block]
                description: "What happens when the connection calls the tool. `allow` runs it, `approve` waits for you, `block` refuses it."
              default_policy:
                type: string
                enum: [allow, approve, block]
                description: The policy a new connection gets for this tool.
