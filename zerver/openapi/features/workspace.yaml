# OpenAPI fragment for the server side of the workspace settings page:
# workspace settings, the role permission matrix, the audit log, and the
# workspace switcher list. See zerver/openapi/features/events_agent.yaml
# for the fragment format, and zproject/feature_routes/workspace.py for
# the routes that this fragment documents.
paths:
  /agent/realm-settings:
    get:
      operationId: get-workspace-realm-settings
      tags: ["workspace"]
      summary: Get workspace settings
      description: |
        Fetch the workspace's Sanji settings: the fields Owner and Admin
        manage from the Umum, Agen & runner, and Model & API key tabs,
        plus a read-only summary of the workspace's default runner and
        model provider and which optional capabilities this server has
        configured.

        **Changes**: New in Zulip 12.0 (feature level ZF-3c02c6).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRealmSettingsResponse"
              example:
                {
                  "result": "success",
                  "msg": "",
                  "brand_color": "#FFD84D",
                  "timezone": "Asia/Jakarta",
                  "summary_default": false,
                  "monthly_budget_microunits": null,
                  "approval_ttl_minutes": 120,
                  "invite_expiry_days": 7,
                  "task_status_notices": false,
                  "require_2fa": false,
                  "task_id_prefix": "",
                  "agent_language": "id",
                  "mcp_default_mode": "research_first",
                  "model_source": {},
                  "model_presets": {},
                  "model_guardrails": {},
                  "work_runner": null,
                  "work_provider": null,
                  "can_create_workspace": false,
                  "capabilities":
                    {
                      "drive": false,
                      "calendar": false,
                      "github": false,
                      "whatsapp": false,
                      "fathom": false,
                      "fathom_join": false,
                      "openrouter": false,
                      "web_push": false,
                      "cloud_runner": false,
                      "docker_runner_image": false,
                      "vapid_public_key": "",
                    },
                }
    patch:
      operationId: update-workspace-realm-settings
      tags: ["workspace"]
      summary: Update workspace settings
      description: |
        Change one or more of the workspace's Sanji settings. Every
        parameter is optional; a parameter left out keeps its current
        value. Changing `monthly_budget_microunits` needs the workspace's
        Owner. Every other change needs the `ws_settings` permission.

        **Changes**: New in Zulip 12.0 (feature level ZF-3c02c6).
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                brand_color:
                  description: |
                    The workspace's accent color, one of four fixed
                    values.
                  type: string
                  enum: ["#FFD84D", "#16C784", "#8B74FF", "#FF6A3D"]
                  example: "#FFD84D"
                timezone:
                  description: |
                    The workspace's time zone, used for morning
                    summaries, deadlines, and meeting schedules. Any
                    IANA time zone name.
                  type: string
                  example: Asia/Jakarta
                summary_default:
                  description: |
                    Whether a newly created room starts with Kaki's
                    daily room summary turned on.
                  type: boolean
                  example: false
                monthly_budget_microunits:
                  description: |
                    The workspace-wide monthly model spending limit, in
                    millionths of a unit of currency, or the special
                    string `"unlimited"` for no limit. Only the
                    workspace's Owner may change this.
                  oneOf:
                    - type: integer
                      minimum: 0
                      maximum: 9223372036854775807
                    - type: string
                      enum: [unlimited]
                  example: 1000000000
                approval_ttl_minutes:
                  description: |
                    How long an agent's request for approval stays open
                    before it expires, in minutes. At most one week.
                  type: integer
                  minimum: 1
                  maximum: 10080
                  example: 120
                invite_expiry_days:
                  $ref: "#/components/schemas/WorkspaceInviteExpiryDays"
                task_status_notices:
                  description: |
                    Whether moving a task to a different column also
                    posts a message to that task's topic.
                  type: boolean
                  example: false
                require_2fa:
                  description: |
                    Whether every member of this workspace must turn on
                    two-factor authentication.
                  type: boolean
                  example: false
                task_id_prefix:
                  description: |
                    The short prefix new tasks in this workspace use for
                    their task ID (for example `GT` for `GT-42`): up to
                    10 capital letters or digits. An empty string uses
                    the workspace's default.
                  type: string
                  pattern: "^[A-Z0-9]{0,10}$"
                  example: GT
                work_runner_id:
                  description: |
                    The ID of the runner this workspace's work (non-code)
                    agents run on by default. Must be one of the
                    requester's own runners that still has access. An
                    empty string clears the default runner.
                  type: string
                  example: 5fc3a7e6-2b3b-4b8e-9c3a-1e2f3a4b5c6d
                work_provider_id:
                  description: |
                    The ID of the model provider this workspace's work
                    agents use by default. Must be one of the
                    requester's own model providers that is turned on,
                    and it must run on the default runner. An empty
                    string clears the default model provider.
                  type: string
                  example: 5fc3a7e6-2b3b-4b8e-9c3a-1e2f3a4b5c6e
                agent_language:
                  description: |
                    The language agents reply in by default.
                  type: string
                  enum: [id, en]
                  example: id
                mcp_default_mode:
                  description: |
                    Whether a new MCP connection defaults to asking for
                    approval before its first use in a job
                    (`research_first`) or to using it right away
                    (`direct`).
                  type: string
                  enum: [research_first, direct]
                  example: research_first
            encoding:
              monthly_budget_microunits:
                contentType: application/json
              invite_expiry_days:
                contentType: application/json
      responses:
        "200":
          description: Success. The response is the same shape as `GET /json/agent/realm-settings`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRealmSettingsResponse"
              example:
                {
                  "result": "success",
                  "msg": "",
                  "brand_color": "#FFD84D",
                  "timezone": "Asia/Jakarta",
                  "summary_default": false,
                  "monthly_budget_microunits": null,
                  "approval_ttl_minutes": 120,
                  "invite_expiry_days": 30,
                  "task_status_notices": false,
                  "require_2fa": false,
                  "task_id_prefix": "",
                  "agent_language": "id",
                  "mcp_default_mode": "research_first",
                  "model_source": {},
                  "model_presets": {},
                  "model_guardrails": {},
                  "work_runner": null,
                  "work_provider": null,
                  "can_create_workspace": false,
                  "capabilities":
                    {
                      "drive": false,
                      "calendar": false,
                      "github": false,
                      "whatsapp": false,
                      "fathom": false,
                      "fathom_join": false,
                      "openrouter": false,
                      "web_push": false,
                      "cloud_runner": false,
                      "docker_runner_image": false,
                      "vapid_public_key": "",
                    },
                }
        "400":
          description: |
            Bad request. Sent for an invalid value, or for a runner or
            model provider that is not one of the requester's own. The
            example below is the response when `work_runner_id` names a
            runner in a different workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
              example:
                {
                  "code": "BAD_REQUEST",
                  "msg": "That runner is not part of this workspace.",
                  "result": "error",
                }
  /realm/permissions:
    get:
      operationId: get-workspace-permissions
      tags: ["workspace"]
      summary: Get the role permission matrix
      description: |
        Fetch the workspace's role permission matrix: which of the 5
        roles (Owner, Admin, Moderator, Member, Guest) currently has each
        of the workspace's permission keys, whether the requester may
        change each cell, and why not when they cannot. Every cell is
        locked for a requester who is not an Owner or an Admin.

        **Changes**: New in Zulip 12.0 (feature level ZF-3c02c6).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePermissionsResponse"
              example:
                {
                  "result": "success",
                  "msg": "",
                  "my_role": "owner",
                  "permissions":
                    [
                      {
                        "key": "ws_settings",
                        "group": "workspace",
                        "cells":
                          {
                            "owner":
                              {
                                "allowed": true,
                                "locked": true,
                                "reason": "owner_always",
                              },
                            "admin":
                              {
                                "allowed": true,
                                "locked": false,
                                "reason": null,
                              },
                            "moderator":
                              {
                                "allowed": false,
                                "locked": false,
                                "reason": null,
                              },
                            "member":
                              {
                                "allowed": false,
                                "locked": false,
                                "reason": null,
                              },
                            "guest":
                              {
                                "allowed": false,
                                "locked": true,
                                "reason": "security_locked",
                              },
                          },
                      },
                    ],
                }
    put:
      operationId: update-workspace-permissions
      tags: ["workspace"]
      summary: Change the role permission matrix
      description: |
        Change one or more cells of the workspace's role permission
        matrix. Each change is one `(key, role)` cell. Needs an Owner or
        an Admin. A locked cell (see `GET /json/realm/permissions`) is
        rejected, and only the workspace's Owner may change the Admin
        column and the `invite` row.

        A permission key backed by one of Zulip's own role-based settings
        only accepts changes that keep the allowed roles a single "this
        role and above" threshold. The request applies all changes to
        one key together, so their order does not matter. Such a key is
        not changed here when its setting uses a custom group.

        **Changes**: New in Zulip 12.0 (feature level ZF-3c02c6).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                changes:
                  description: |
                    A JSON-encoded list of the cells to change.
                  type: array
                  items:
                    $ref: "#/components/schemas/WorkspacePermissionChange"
                  example:
                    [
                      {
                        "key": "room_summary",
                        "role": "moderator",
                        "allowed": true,
                      },
                    ]
              required:
                - changes
            encoding:
              changes:
                contentType: application/json
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        "400":
          description: |
            Bad request. Sent for an unknown permission key or role, or
            for a locked cell. The example below is the response when a
            change targets a locked cell.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
              example:
                {
                  "code": "BAD_REQUEST",
                  "msg": "That permission is locked.",
                  "result": "error",
                }
  /realm/audit:
    get:
      operationId: get-workspace-audit
      tags: ["workspace"]
      summary: Get the audit log
      description: |
        Fetch the workspace's audit log, newest first: changes to
        settings, permissions, roles, members, invitations, rooms,
        agents, runners, and integrations, and the steps of agent jobs.
        Each event shows only its type and a few details, never message
        text or the text of a job. Needs the `audit` permission
        (`GET /json/realm/permissions`).

        **Changes**: New in Zulip 12.0 (feature level ZF-3c02c6).
      parameters:
        - name: before
          in: query
          description: |
            Only return events older than this time, as a Unix
            timestamp. Omit to start from the most recent event. To get
            the next page, pass the `time` and the `id` of the last event
            of the current page as `before` and `before_id`.
          content:
            application/json:
              schema:
                type: number
                minimum: 0
              example: 1727150000.5
        - name: before_id
          in: query
          description: |
            The `id` of the last event of the current page. Use it
            together with `before`, so that the next page also includes
            the other events at that same time.
          schema:
            type: string
          example: "realm:1234"
        - name: limit
          in: query
          description: |
            The maximum number of events to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
          example: 50
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAuditResponse"
              example:
                {
                  "result": "success",
                  "msg": "",
                  "events":
                    [
                      {
                        "id": "realm:1234",
                        "event_type": "WORKSPACE_SETTINGS_CHANGED",
                        "time": 1727150000.5,
                        "actor":
                          {"kind": "human", "id": 12, "name": "Dita Anggraini"},
                        "parameter":
                          {
                            "changed":
                              [
                                {
                                  "property": "timezone",
                                  "old_value": "Asia/Jakarta",
                                  "new_value": "Asia/Makassar",
                                },
                              ],
                          },
                      },
                    ],
                }
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
              example:
                {
                  "code": "BAD_REQUEST",
                  "msg": "You do not have permission to do this.",
                  "result": "error",
                }
  /realm/audit.csv:
    get:
      operationId: export-workspace-audit-csv
      tags: ["workspace"]
      summary: Export the audit log as CSV
      description: |
        Every event of `GET /json/realm/audit`, as a UTF-8 CSV file for an
        Owner or Admin to keep outside the app. The time column uses the
        workspace's time zone, and the "what happened" column is text in
        the workspace's own language. Needs the `audit` permission
        (`GET /json/realm/permissions`).

        **Changes**: New in Zulip 12.0 (feature level ZF-3c02c6).
      responses:
        "200":
          description: |
            Success. The response is a `text/csv` file, not the usual
            JSON envelope.
          content:
            text/csv: {}
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
              example:
                {
                  "code": "BAD_REQUEST",
                  "msg": "You do not have permission to do this.",
                  "result": "error",
                }
  /users/me/workspaces:
    get:
      operationId: list-my-workspaces
      tags: ["workspace"]
      summary: List my workspaces
      description: |
        List every workspace on this server the requester's email
        belongs to, for the workspace switcher: name, URL, role, accent
        color, and which one is the current workspace.

        **Changes**: New in Zulip 12.0 (feature level ZF-3c02c6).
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
              example:
                {
                  "result": "success",
                  "msg": "",
                  "workspaces":
                    [
                      {
                        "realm_id": 2,
                        "name": "Grow Team",
                        "url": "https://team.growc.id",
                        "role": "owner",
                        "brand_color": "#FFD84D",
                        "initial": "G",
                        "current": true,
                      },
                    ],
                }
components:
  schemas:
    WorkspaceInviteExpiryDays:
      description: |
        How long a pending invitation stays valid: `7` or `30` days, or
        the special string `"unlimited"` for no expiry.
      oneOf:
        - type: integer
          enum: [7, 30]
        - type: string
          enum: [unlimited]
      example: 7
    WorkspaceCapabilities:
      type: object
      additionalProperties: false
      description: |
        Which optional integrations and features this server has
        configured for this workspace. A person's client hides or
        disables the matching control when the value is `false` or an
        empty string.
      properties:
        drive:
          type: boolean
        calendar:
          type: boolean
        github:
          type: boolean
        whatsapp:
          type: boolean
        fathom:
          type: boolean
        fathom_join:
          type: boolean
        openrouter:
          type: boolean
        web_push:
          type: boolean
        cloud_runner:
          type: boolean
        docker_runner_image:
          type: boolean
        vapid_public_key:
          type: string
          description: The public key a client needs to create a Web Push subscription, or an empty string when Web Push is not configured.
      required:
        [
          drive,
          calendar,
          github,
          whatsapp,
          fathom,
          fathom_join,
          openrouter,
          web_push,
          cloud_runner,
          docker_runner_image,
          vapid_public_key,
        ]
    WorkspaceRealmSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/JsonSuccessBase"
        - type: object
          additionalProperties: false
          properties:
            result: {}
            msg: {}
            ignored_parameters_unsupported: {}
            brand_color:
              type: string
              description: The workspace's accent color.
            timezone:
              type: string
              description: The workspace's IANA time zone name.
            summary_default:
              type: boolean
              description: Whether a new room starts with the daily room summary turned on.
            monthly_budget_microunits:
              type: integer
              nullable: true
              description: The workspace-wide monthly model spending limit, or `null` for no limit.
            approval_ttl_minutes:
              type: integer
              description: How long an agent's request for approval stays open, in minutes.
            invite_expiry_days:
              type: integer
              nullable: true
              description: How long a pending invitation stays valid, in days, or `null` for no expiry.
            task_status_notices:
              type: boolean
              description: Whether moving a task also posts a message to its topic.
            require_2fa:
              type: boolean
              description: Whether every member must turn on two-factor authentication.
            task_id_prefix:
              type: string
              description: The prefix new tasks use for their task ID.
            agent_language:
              type: string
              enum: [id, en]
              description: The language agents reply in by default.
            mcp_default_mode:
              type: string
              enum: [research_first, direct]
              description: Whether a new MCP connection defaults to asking for approval first.
            model_source:
              type: object
              additionalProperties: true
              description: Read-only. Where this workspace's model spending comes from.
            model_presets:
              type: object
              additionalProperties: true
              description: Read-only. The model behind each of the Cepat/Seimbang/Terbaik presets.
            model_guardrails:
              type: object
              additionalProperties: true
              description: Read-only. This workspace's model guardrail settings.
            work_runner:
              description: The runner this workspace's work agents use by default, or `null` if none is set.
              type: object
              nullable: true
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: The runner's ID.
                name:
                  type: string
                  description: The runner's name.
                status:
                  type: string
                  description: The runner's current observed status.
                  enum: [online, offline, stale, revoked, unknown]
                model:
                  type: string
                  nullable: true
                  description: Always `null`. A runner can serve many models.
            work_provider:
              description: The model provider this workspace's work agents use by default, or `null` if none is set.
              type: object
              nullable: true
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: The provider's ID.
                name:
                  type: string
                  description: The provider's name.
                status:
                  type: string
                  description: Whether this provider currently accepts new requests.
                  enum: [active, disabled]
                model:
                  type: string
                  description: The model this provider serves.
            can_create_workspace:
              type: boolean
              description: Whether the requester may create a new workspace on this server right now.
            capabilities:
              $ref: "#/components/schemas/WorkspaceCapabilities"
          required:
            [
              brand_color,
              timezone,
              summary_default,
              monthly_budget_microunits,
              approval_ttl_minutes,
              invite_expiry_days,
              task_status_notices,
              require_2fa,
              task_id_prefix,
              agent_language,
              mcp_default_mode,
              model_source,
              model_presets,
              model_guardrails,
              work_runner,
              work_provider,
              can_create_workspace,
              capabilities,
            ]
    WorkspacePermissionChange:
      type: object
      description: One cell of the role permission matrix to change.
      properties:
        key:
          type: string
          description: The permission key (the `key` field of a row from `GET /json/realm/permissions`).
        role:
          type: string
          description: The role this change applies to.
          enum: [owner, admin, moderator, member, guest]
        allowed:
          type: boolean
          description: Whether this role should have this permission.
      required: [key, role, allowed]
    WorkspacePermissionCell:
      type: object
      additionalProperties: false
      description: One role's value for one permission key.
      properties:
        allowed:
          type: boolean
          description: Whether this role currently has this permission.
        locked:
          type: boolean
          description: Whether the requester cannot change this cell.
        reason:
          type: string
          nullable: true
          description: |
            Why the requester cannot change this cell (`owner_always`,
            `owner_only_admin_column`, or `security_locked`), or `null`
            when they can.
      required: [allowed, locked, reason]
    WorkspacePermissionRow:
      type: object
      additionalProperties: false
      description: One permission key, and every role's current value for it.
      properties:
        key:
          type: string
          description: The permission key.
        group:
          type: string
          description: Which settings-page group this permission belongs to.
          enum: [workspace, members, rooms, agents, security]
        cells:
          type: object
          description: This row's value for each of the 5 roles, keyed by role name.
          additionalProperties:
            $ref: "#/components/schemas/WorkspacePermissionCell"
      required: [key, group, cells]
    WorkspacePermissionsResponse:
      allOf:
        - $ref: "#/components/schemas/JsonSuccessBase"
        - type: object
          additionalProperties: false
          properties:
            result: {}
            msg: {}
            ignored_parameters_unsupported: {}
            my_role:
              type: string
              description: The requester's own role in this workspace.
              enum: [owner, admin, moderator, member, guest]
            permissions:
              type: array
              description: One row per permission key.
              items:
                $ref: "#/components/schemas/WorkspacePermissionRow"
          required: [my_role, permissions]
    WorkspaceAuditEvent:
      type: object
      additionalProperties: false
      description: One event of the audit log.
      properties:
        id:
          type: string
          description: |
            A stable ID for this event. Pass it as `before_id` to get the
            next page.
        event_type:
          type: string
          description: A stable, all-caps event type name.
        time:
          type: number
          description: When this event happened, as a Unix timestamp.
        actor:
          description: Who caused this event, or `null` for a system-caused event.
          type: object
          nullable: true
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [human, agent]
            id:
              type: integer
              description: The user's ID (the agent's own bot user, for an agent actor).
            name:
              type: string
          required: [kind, id, name]
        parameter:
          type: object
          additionalProperties: true
          description: Event-specific detail. Its keys vary by `event_type`.
      required: [id, event_type, time, actor, parameter]
    WorkspaceAuditResponse:
      allOf:
        - $ref: "#/components/schemas/JsonSuccessBase"
        - type: object
          additionalProperties: false
          properties:
            result: {}
            msg: {}
            ignored_parameters_unsupported: {}
            events:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceAuditEvent"
          required: [events]
    WorkspaceListEntry:
      type: object
      additionalProperties: false
      description: One workspace in the requester's workspace switcher.
      properties:
        realm_id:
          type: integer
          description: The workspace's realm ID.
        name:
          type: string
          description: The workspace's name.
        url:
          type: string
          description: The workspace's URL.
        role:
          type: string
          description: The requester's role in this workspace.
          enum: [owner, admin, moderator, member, guest]
        brand_color:
          type: string
          description: The workspace's accent color, or an empty string if it has not chosen one.
        initial:
          type: string
          description: A single letter for the workspace's badge.
        current:
          type: boolean
          description: Whether this is the workspace the request was made to.
      required: [realm_id, name, url, role, brand_color, initial, current]
    WorkspaceListResponse:
      allOf:
        - $ref: "#/components/schemas/JsonSuccessBase"
        - type: object
          additionalProperties: false
          properties:
            result: {}
            msg: {}
            ignored_parameters_unsupported: {}
            workspaces:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceListEntry"
          required: [workspaces]
